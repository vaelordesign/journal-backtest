function enSaisie(el){ return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable); }
var branche = false;
function brancher(){
  if (branche) return;
  branche = true;
  $$('#nav button').forEach(function(b){ b.onclick = function(){ allerA(b.dataset.ecran); }; });
  $('#filtreCampagne').onchange = function(){ E.filtre.campagne = this.value; E.cal = null; rendre(); };
  $('#filtreDebut').onchange = function(){ E.filtre.debut = this.value; rendre(); };
  $('#filtreFin').onchange = function(){ E.filtre.fin = this.value; rendre(); };
  $('#filtreToutes').onclick = function(){ E.filtre.debut = ''; E.filtre.fin = ''; rendre(); };
  $('#filtreConformes').onchange = function(){ E.filtre.conformes = this.checked; rendre(); };
  $('#filtreSurs').onchange = function(){ E.filtre.surs = this.checked; rendre(); };
  if ($('#btnSauvegarde')) $('#btnSauvegarde').onclick = function(){ exporterTout(true); };
  if ($('#btnRestaurer')) $('#btnRestaurer').onclick = function(){ $('#fichierSauvegarde').click(); };
  if ($('#btnPartager')) $('#btnPartager').onclick = formulairePartage;
  if ($('#fichierSauvegarde')) $('#fichierSauvegarde').onchange = function(e){ if (e.target.files[0]) importerSauvegarde(e.target.files[0]); e.target.value = ''; };
  var lj = $('#lienJournal');
  if (lj && location.protocol === 'file:') lj.href = '../journal-trading/index.html#bord';

  document.addEventListener('click', function(e){
    var f = e.target.closest('[data-fermer]');
    if (f) { fermerModale(); return; }
    var a = e.target.closest('[data-aller]');
    if (a) { e.preventDefault(); if (modaleOuverte()) fermerModale(); allerA(a.dataset.aller); return; }
    var r = e.target.closest('svg [data-trade]');
    if (r && !E.rapport) { formulaireTrade(r.dataset.trade); }
  });
  document.addEventListener('mousemove', function(e){
    var b = e.target.closest && e.target.closest('[data-bulle]');
    if (b) bulleMontrer(e, b.getAttribute('data-bulle')); else bulleCacher();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') {
      var g = document.querySelector('.grande-image');
      if (g) { g.remove(); return; }
      // la fiche d'un trade ne se ferme pas par Echap : on perdrait la saisie
      if (modaleOuverte() && !$('#modale')._raccourcis) fermerModale();
      return;
    }
    if (modaleOuverte()) {
      var m = $('#modale');
      if (m._raccourcis) m._raccourcis(e);
      return;
    }
    if (E.ecran !== 'seance' || E.rapport || enSaisie(e.target) || e.ctrlKey || e.metaKey || e.altKey) return;
    var c = campagneActive();
    if (!c) return;
    var k = e.key.toLowerCase();
    if (k === 'n') { e.preventDefault(); formulaireTrade(null, { campagneId: c.id, date: c.jourCourant }); }
    else if (k === 'j') { e.preventDefault(); terminerJour(c); }
    else if (k === 's') { e.preventDefault(); changerJour(c, jourOuvrable(c.jourCourant, 1)); }
    else if (k === 'p') { e.preventDefault(); changerJour(c, jourOuvrable(c.jourCourant, -1)); }
  });
  // Ctrl+V d'une capture : elle va dans la fiche du trade ouverte
  document.addEventListener('paste', function(e){
    var m = $('#modale');
    if (!modaleOuverte() || !m._ajouterImages || !e.clipboardData) return;
    var fichiers = [];
    Array.prototype.forEach.call(e.clipboardData.items || [], function(it){
      if (it.kind === 'file' && it.type.indexOf('image/') === 0) { var f = it.getAsFile(); if (f) fichiers.push(f); }
    });
    if (!fichiers.length) return;
    e.preventDefault();
    m._ajouterImages(fichiers);
  });
  var largeurAvant = window.innerWidth < 700;
  var minut = null;
  window.addEventListener('resize', function(){
    clearTimeout(minut);
    minut = setTimeout(function(){ var l = window.innerWidth < 700; if (l !== largeurAvant && !modaleOuverte()) { largeurAvant = l; rendre(); } }, 250);
  });
  window.addEventListener('hashchange', function(){
    var h = location.hash.replace('#', '');
    // un autre rapport, ou la sortie d'un rapport vers son propre journal : on repart de zero
    if (h.indexOf('rapport=') === 0) { if (!E.rapport || h.split('&ecran=')[0] !== E.rapportCode) location.reload(); return; }
    if (E.rapport) { location.reload(); return; }
    if (ECRANS.indexOf(h) >= 0 && h !== E.ecran) allerA(h);
  });
}
