<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal de backtest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%235b8cff%22/%3E%3Cpath d=%22M6 22l6-7 5 4 9-11%22 stroke=%22%23fff%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<style>
/* ===================== THEME (le meme que le journal de trading) ===================== */
:root{
  --fond:#0b0e14;
  --fond2:#131722;
  --fond3:#1b2130;
  --fond4:#232b3d;
  --bord:#262d3d;
  --bord2:#38415a;
  --texte:#e6e9ef;
  --texte2:#8b93a7;
  --texte3:#5d6577;
  --vert:#26a69a;
  --vert-clair:#4ddbcc;
  --vert-fond:rgba(38,166,154,.14);
  --rouge:#ef5350;
  --rouge-clair:#ff8a87;
  --rouge-fond:rgba(239,83,80,.14);
  --accent:#5b8cff;
  --accent-fond:rgba(91,140,255,.14);
  --jaune:#f0b90b;
  --violet:#b388ff;
  --r:10px;
  --ombre:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fond);
  color:var(--texte);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0 0 10px;font-weight:650;line-height:1.2}
h1{font-size:20px}
h2{font-size:17px}
h3{font-size:15px}
h4{font-size:13px;color:var(--texte2);text-transform:uppercase;letter-spacing:.06em}
a{color:var(--accent)}
p{margin:0 0 10px}
code{background:var(--fond3);border:1px solid var(--bord);border-radius:5px;padding:0 5px;font-size:12px}
.num{font-variant-numeric:tabular-nums}
.vert{color:var(--vert)}
.rouge{color:var(--rouge)}
.jaune{color:var(--jaune)}
.gris{color:var(--texte2)}
.gris3{color:var(--texte3)}
.petit{font-size:12px}
.mini{font-size:11px}
.gras{font-weight:650}
.centre{text-align:center}
.droite{text-align:right}
.nowrap{white-space:nowrap}
.mb0{margin-bottom:0}
.mt8{margin-top:8px}
.mt12{margin-top:12px}
.ligne{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ligne.ecart{justify-content:space-between}
.pousse{margin-left:auto}

/* ===================== STRUCTURE ===================== */
header{
  position:sticky;top:0;z-index:60;
  background:rgba(11,14,20,.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--bord);
}
.entete-haut{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;flex-wrap:wrap;
}
.marque{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo{
  width:26px;height:26px;border-radius:7px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--jaune),var(--accent));
  display:grid;place-items:center;font-size:14px;
}
.entete-droite{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
nav{
  display:flex;gap:2px;padding:0 8px 8px;
  overflow-x:auto;scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}
nav::-webkit-scrollbar{height:4px}
nav::-webkit-scrollbar-thumb{background:var(--bord2);border-radius:4px}
nav button{
  background:none;border:0;color:var(--texte2);
  padding:7px 11px;border-radius:8px;cursor:pointer;
  font-size:13px;font-family:inherit;white-space:nowrap;font-weight:500;
}
nav button:hover{background:var(--fond3);color:var(--texte)}
nav button.actif{background:var(--fond4);color:#fff}
main{padding:14px;max-width:1500px;margin:0 auto}
.ecran{display:none}
.ecran.actif{display:block}

/* ===================== COMPOSANTS ===================== */
.carte{
  background:var(--fond2);border:1px solid var(--bord);
  border-radius:var(--r);padding:14px;margin-bottom:14px;
  min-width:0;
}
.carte.serre{padding:10px}
.carte h3 .puce{vertical-align:middle;margin-left:4px}
.grille{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media(max-width:1150px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.g3,.g4,.g5,.g21{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1fr)}}
@media(max-width:560px){.g2,.g3,.g4,.g5{grid-template-columns:minmax(0,1fr)}}

button,.bouton{
  font-family:inherit;font-size:13px;
  background:var(--fond3);color:var(--texte);
  border:1px solid var(--bord2);border-radius:8px;
  padding:7px 12px;cursor:pointer;font-weight:500;
}
button:hover,.bouton:hover{background:var(--fond4);border-color:#4a5570}
button:active{transform:translateY(1px)}
button.primaire{background:var(--accent);border-color:var(--accent);color:#fff}
button.primaire:hover{background:#6d9aff}
button.vertb{background:var(--vert);border-color:var(--vert);color:#04211f}
button.vertb:hover{background:#2fbcae}
button.rougeb{background:var(--rouge);border-color:var(--rouge);color:#fff}
button.dangereux{background:transparent;border-color:#6d2f2f;color:var(--rouge-clair)}
button.dangereux:hover{background:rgba(239,83,80,.12)}
button.fantome{background:transparent;border-color:transparent;color:var(--texte2)}
button.fantome:hover{background:var(--fond3);color:var(--texte)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pt{padding:4px 8px;font-size:12px}
button.gros{padding:11px 16px;font-size:14px;font-weight:600}
kbd{
  display:inline-block;min-width:18px;padding:0 5px;border-radius:4px;
  border:1px solid rgba(255,255,255,.25);font-size:10px;line-height:16px;
  text-align:center;font-family:inherit;opacity:.8;margin-left:4px;
}

input,select,textarea{
  font-family:inherit;font-size:13px;
  background:var(--fond);color:var(--texte);
  border:1px solid var(--bord2);border-radius:8px;
  padding:7px 9px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
label.champ,div.champ{display:block;margin-bottom:10px;min-width:0}
label.champ>span,div.champ>span{display:block;font-size:11px;color:var(--texte2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
label.champ>small,div.champ>small{display:block;font-size:11px;color:var(--texte3);margin-top:3px}
input[type=checkbox]{width:auto;accent-color:var(--accent);cursor:pointer}
input[type=date],input[type=time]{color-scheme:dark}

.chiffre{
  background:var(--fond2);border:1px solid var(--bord);
  border-radius:var(--r);padding:13px 15px;min-width:0;
}
.chiffre .etq{font-size:11px;color:var(--texte2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.chiffre .val{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.chiffre .sous{font-size:11px;color:var(--texte3);margin-top:4px}
@media(max-width:560px){.chiffre .val{font-size:22px}}

.tableau-boite{overflow-x:auto;border:1px solid var(--bord);border-radius:var(--r);background:var(--fond2)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.auto{min-width:0}
@media(max-width:620px){
  table.auto td{white-space:normal}
  table.auto td.num{text-align:right}
}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bord);white-space:nowrap}
th{
  background:var(--fond3);color:var(--texte2);
  font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;
}
th.triable{cursor:pointer;user-select:none}
th.triable:hover{color:var(--texte)}
tbody tr:hover{background:var(--fond3)}
tbody tr.clic{cursor:pointer}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.faible td{color:var(--texte3)}
tr.faible td.etq-faible:after{content:" peu de trades";font-size:10px;color:var(--texte3);margin-left:6px}
tr.total td{font-weight:650;background:var(--fond3)}

.puce{
  display:inline-block;padding:2px 8px;border-radius:20px;
  font-size:11px;border:1px solid var(--bord2);background:var(--fond3);
  color:var(--texte2);white-space:nowrap;
}
.puce.v{background:var(--vert-fond);border-color:rgba(38,166,154,.4);color:var(--vert-clair)}
.puce.r{background:var(--rouge-fond);border-color:rgba(239,83,80,.4);color:var(--rouge-clair)}
.puce.a{background:var(--accent-fond);border-color:rgba(91,140,255,.4);color:#9db8ff}
.puce.j{background:rgba(240,185,11,.14);border-color:rgba(240,185,11,.4);color:#ffd45e}
.puce.p{background:rgba(179,136,255,.14);border-color:rgba(179,136,255,.4);color:#d1b8ff}

.etiquettes{display:flex;flex-wrap:wrap;gap:6px}
.etq-choix{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:20px;cursor:pointer;
  border:1px solid var(--bord2);background:var(--fond3);
  font-size:12px;user-select:none;
}
.etq-choix:hover{background:var(--fond4)}
.etq-choix.on{background:var(--accent-fond);border-color:var(--accent);color:#cfdcff}
.etq-choix.oblig.on{background:var(--vert-fond);border-color:var(--vert);color:var(--vert-clair)}
.etq-choix.oblig:not(.on){border-style:dashed}
.etq-choix input{display:none}
.etq-choix .etoile{color:var(--jaune);font-size:11px}

.vide{
  padding:34px 16px;text-align:center;color:var(--texte2);
  border:1px dashed var(--bord2);border-radius:var(--r);
}
.avis{
  border-radius:var(--r);padding:11px 13px;margin-bottom:12px;
  border:1px solid var(--bord2);background:var(--fond3);font-size:13px;
}
.avis.vertf{background:var(--vert-fond);border-color:rgba(38,166,154,.4)}
.avis.rougef{background:var(--rouge-fond);border-color:rgba(239,83,80,.45)}
.avis.jaunef{background:rgba(240,185,11,.1);border-color:rgba(240,185,11,.4)}
.avis.bleuf{background:var(--accent-fond);border-color:rgba(91,140,255,.4)}
.avis :last-child{margin-bottom:0}

.zone-depot{
  border:2px dashed var(--bord2);border-radius:14px;
  padding:34px 18px;text-align:center;cursor:pointer;
  background:var(--fond2);transition:border-color .15s,background .15s;
}
.zone-depot:hover,.zone-depot.survol{border-color:var(--accent);background:var(--accent-fond)}
.zone-depot .icone{font-size:30px;margin-bottom:8px}

.barre-ligne{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.barre-etq{flex:0 0 auto;width:150px;font-size:12px;color:var(--texte2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barre-piste{flex:1 1 auto;height:9px;background:var(--fond3);border-radius:20px;position:relative;overflow:hidden;min-width:40px}
.barre-piste>div{position:absolute;top:0;bottom:0;border-radius:20px}
.barre-val{flex:0 0 auto;width:86px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
@media(max-width:560px){.barre-etq{width:88px}.barre-val{width:70px}}

.progres{height:10px;background:var(--fond3);border-radius:20px;overflow:hidden;border:1px solid var(--bord)}
.progres>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--vert));border-radius:20px}

.cal-entete{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cal-grille{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-jour-nom{text-align:center;font-size:11px;color:var(--texte3);text-transform:uppercase;padding-bottom:2px}
.cal-case{
  border:1px solid var(--bord);border-radius:8px;
  min-height:74px;padding:6px;background:var(--fond2);
  display:flex;flex-direction:column;gap:2px;position:relative;cursor:pointer;
}
.cal-case.hors{opacity:.28;cursor:default}
.cal-case:not(.hors):hover{border-color:var(--bord2)}
.cal-case.g{background:var(--vert-fond);border-color:rgba(38,166,154,.45)}
.cal-case.p{background:var(--rouge-fond);border-color:rgba(239,83,80,.45)}
.cal-case.n{background:var(--fond3);border-color:var(--bord2)}
.cal-case.vide-teste{background:repeating-linear-gradient(135deg,var(--fond2),var(--fond2) 6px,var(--fond3) 6px,var(--fond3) 12px)}
.cal-case.weekend{opacity:.45}
.cal-case.periode{box-shadow:inset 0 -2px 0 var(--accent)}
.cal-case .jnum{font-size:11px;color:var(--texte2)}
.cal-case .jval{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.cal-case .jnb{font-size:10px;color:var(--texte3);margin-top:auto}
@media(max-width:700px){
  .cal-case{min-height:56px;padding:4px}
  .cal-case .jval{font-size:11px}
  .cal-case .jnb{font-size:9px}
}

.voile{
  position:fixed;inset:0;z-index:100;
  background:rgba(4,6,10,.72);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;
  padding:18px;overflow-y:auto;
}
.voile[hidden]{display:none}
@media(max-width:560px){.voile{padding:6px}}
.modale{
  background:var(--fond2);border:1px solid var(--bord2);
  border-radius:14px;box-shadow:var(--ombre);
  width:100%;max-width:980px;margin:auto;
}
.modale.large{max-width:1200px}
.modale.petite{max-width:520px}
.modale-entete{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:13px 16px;border-bottom:1px solid var(--bord);
  position:sticky;top:0;background:var(--fond2);border-radius:14px 14px 0 0;z-index:3;
}
.modale-entete h2{margin:0;min-width:0;overflow-wrap:break-word}
.modale-corps{padding:16px}
.modale-pied{
  display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center;
  padding:12px 16px;border-top:1px solid var(--bord);
  position:sticky;bottom:0;background:var(--fond2);border-radius:0 0 14px 14px;
}
.fermer{margin-left:auto}

.galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.galerie figure{margin:0;position:relative;border:1px solid var(--bord2);border-radius:8px;overflow:hidden;background:var(--fond)}
.galerie img{width:100%;height:105px;object-fit:cover;display:block;cursor:zoom-in}
.galerie .sup{
  position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);
  border:0;color:#fff;border-radius:6px;padding:2px 6px;font-size:11px;cursor:pointer;
}
.galerie figcaption{font-size:10px;color:var(--texte3);padding:3px 5px;text-align:center}
.zone-coller{
  border:1px dashed var(--bord2);border-radius:8px;padding:12px;
  text-align:center;color:var(--texte2);font-size:12px;margin-top:8px;
}
.zone-coller.survol{border-color:var(--accent);background:var(--accent-fond)}

.mur{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.mur .tuile{border:1px solid var(--bord);border-radius:10px;overflow:hidden;background:var(--fond2);cursor:pointer}
.mur .tuile:hover{border-color:var(--bord2)}
.mur .tuile img{width:100%;height:160px;object-fit:cover;display:block;background:var(--fond)}
.mur .tuile .bas{padding:7px 9px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}

svg text{font-family:inherit}
.infobulle{
  position:fixed;z-index:200;pointer-events:none;
  background:#000;border:1px solid var(--bord2);border-radius:7px;
  padding:6px 9px;font-size:12px;white-space:nowrap;box-shadow:var(--ombre);
}
.infobulle[hidden]{display:none}

.bandeau{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:9px 12px;background:var(--fond2);border:1px solid var(--bord);
  border-radius:var(--r);margin-bottom:14px;
}
.bandeau select{width:auto;max-width:100%;padding:5px 7px}
.bandeau input[type=date]{width:auto;padding:5px 7px}
.bandeau .sep{color:var(--texte3)}
.pilule-interrupteur{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--texte2);cursor:pointer;white-space:nowrap}

/* ===================== SAISIE D'UN TRADE ===================== */
.choix-boutons{display:flex;gap:4px;flex-wrap:wrap}
.choix-boutons button{padding:6px 12px;font-size:13px}
.choix-boutons button.on{background:var(--accent-fond);border-color:var(--accent);color:#fff}
.choix-boutons button.on[data-v="long"],.choix-boutons button.on[data-v="haussier"],.choix-boutons button.on[data-v="tp"]{background:var(--vert);border-color:var(--vert);color:#04211f}
.choix-boutons button.on[data-v="short"],.choix-boutons button.on[data-v="baissier"],.choix-boutons button.on[data-v="sl"]{background:var(--rouge);border-color:var(--rouge);color:#fff}
.choix-boutons button.on[data-v="be"],.choix-boutons button.on[data-v="neutre"]{background:var(--jaune);border-color:var(--jaune);color:#241a00}
.choix-boutons.qualite button.on[data-v="D"],.choix-boutons.qualite button.on[data-v="C"]{background:var(--rouge);border-color:var(--rouge);color:#fff}
.choix-boutons.qualite button.on[data-v="B"]{background:var(--jaune);border-color:var(--jaune);color:#241a00}
.choix-boutons.qualite button.on[data-v="A"],.choix-boutons.qualite button.on[data-v="A+"]{background:var(--vert);border-color:var(--vert);color:#04211f}
.choix-boutons.grand button{padding:10px 16px;font-size:14px;font-weight:650;min-width:70px}
.bloc-saisie{border:1px solid var(--bord);border-radius:var(--r);padding:12px;margin-bottom:12px;background:var(--fond)}
.bloc-saisie>h4{margin-bottom:8px}
.r-apercu{font-size:28px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1}
.saisie-r{display:flex;gap:4px;align-items:center}
.saisie-r input{width:90px;text-align:right;font-variant-numeric:tabular-nums}
input.r-pos{border-color:var(--vert);color:var(--vert-clair)}
input.r-neg{border-color:var(--rouge);color:var(--rouge-clair)}
input.r-faux{border-color:var(--rouge);border-style:dashed}
.aide{font-size:11px;color:var(--texte3);margin-top:4px;line-height:1.4}
details.plus{border:1px solid var(--bord);border-radius:var(--r);padding:0 12px;margin-bottom:12px;background:var(--fond)}
details.plus>summary{cursor:pointer;padding:10px 0;font-size:13px;color:var(--texte2);font-weight:600}
details.plus[open]>summary{border-bottom:1px solid var(--bord);margin-bottom:10px}

/* ===================== SEANCE DE REPLAY ===================== */
.jour-courant{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jour-courant .grand-jour{font-size:22px;font-weight:700;min-width:0}
.jour-courant .grand-jour small{display:block;font-size:12px;color:var(--texte2);font-weight:500}
.actions-seance{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:560px){.actions-seance button{flex:1 1 100%;white-space:normal}}
.ligne-trade{
  display:grid;grid-template-columns:60px 70px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:8px 10px;border:1px solid var(--bord);border-radius:8px;margin-bottom:6px;background:var(--fond);cursor:pointer;
}
.ligne-trade:hover{border-color:var(--bord2)}
.ligne-trade .r{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
@media(max-width:560px){.ligne-trade{grid-template-columns:50px 56px minmax(0,1fr) auto;gap:6px}}
.checklist li{margin-bottom:5px}
.checklist{padding-left:20px;margin:0}

.carte-campagne{border-left:4px solid var(--accent)}
.liste-camp{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media(max-width:400px){.liste-camp{grid-template-columns:minmax(0,1fr)}}

/* ===================== GRILLES DE SIMULATION ===================== */

<script>
'use strict';
/* ==================== DEBUT MOTEUR ====================
   Tout ce qui se trouve entre DEBUT MOTEUR et FIN MOTEUR est du calcul pur,
   sans DOM ni base de donnees. Le fichier verifier-moteur.cjs decoupe
   exactement ce bloc de texte et le rejoue dans Node : le test tourne donc
   sur le code livre, pas sur une copie qui pourrait diverger.

   Un backtest se compte en R, jamais en dollars :
     +3   = cible d'un 1:3 touchee
     -1   = stop touche
      0   = sortie au point mort (BE)
   Les dates et heures d'un trade sont celles du GRAPHIQUE en replay
   ("2025-03-12" et "09:42"), gardees en texte : aucun fuseau horaire,
   aucun changement d'heure ne peut les decaler.
   ======================================================================= */

var JOURS_FR = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
var JOURS_FR_COURT = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
var MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var MOIS_COURT = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
var QUALITES = ['D', 'C', 'B', 'A', 'A+'];

// Heures de New York, celles du graphique de Julien (Montreal = meme fuseau).
// Une ligne par seance : "Nom HH:MM-HH:MM". Une seance peut passer minuit.
var SEANCES_DEFAUT =
  'Asie 18:00-00:00\n' +
  'Nuit 00:00-02:00\n' +
  'Londres 02:00-05:00\n' +
  'Avant l\'ouverture 05:00-09:30\n' +
  'NY matin 09:30-12:00\n' +
  'Midi 12:00-13:30\n' +
  'NY après-midi 13:30-16:00\n' +
  'Fin de journée 16:00-18:00';

var EPS = 1e-9;

// ---------- petits outils ----------
function estZero(x){ return Math.abs(x) < EPS; }
function estNombre(x){ return typeof x === 'number' && isFinite(x); }
function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }
function arrondi(x, d){ var p = Math.pow(10, d === undefined ? 6 : d); return Math.round(x * p) / p; }
function somme(v){ var s = 0; for (var i = 0; i < v.length; i++) s += v[i]; return s; }
function moyenneDe(v){ return v.length ? somme(v) / v.length : null; }

function normaliserTexte(s){
  return String(s == null ? '' : s)
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '');
}

// "1 234,56", "$2.25", "(41.25)", "-1 250,00 $" -> nombre ; vide -> null.
// Regle sur la virgule : "7694,50" = decimale ; "1,234" (3 chiffres apres) = milliers.
function versNombre(v){
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  var s = String(v).trim().replace(/[−–—]/g, '-');
  if (!s || s === '-' || s === '--') return null;
  var neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[^0-9,.\-+]/g, '');
  if (!s || !/\d/.test(s)) return null;
  if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) {
    s = s.lastIndexOf(',') > s.lastIndexOf('.')
      ? s.replace(/\./g, '').replace(/,/g, '.')
      : s.replace(/,/g, '');
  } else if (s.indexOf(',') >= 0) {
    var p = s.split(',');
    s = (p.length === 2 && p[1].length !== 3) ? p[0] + '.' + p[1] : s.replace(/,/g, '');
  }
  var n = parseFloat(s);
  if (!isFinite(n)) return null;
  return neg ? -Math.abs(n) : n;
}

function fmtNombre(n, d){
  if (n === null || n === undefined || !isFinite(n)) return '--';
  var v = Number(n).toFixed(d === undefined ? 2 : d);
  if (/^-0(\.0+)?$/.test(v)) v = v.slice(1);
  var parts = v.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return parts.join(',');
}
function fmtArgent(n, d){
  if (n === null || n === undefined || !isFinite(n)) return '--';
  return fmtNombre(n, d === undefined ? 0 : d) + ' $';
}
function fmtPct(x, d){
  if (x === null || x === undefined || !isFinite(x)) return '--';
  return fmtNombre(x * 100, d === undefined ? 0 : d) + ' %';
}
// "+3 R", "-1 R", "0 R", "+0,45 R" : un R s'affiche toujours avec son signe
function fmtR(v, d){
  if (v === null || v === undefined || !isFinite(v)) return '--';
  var txt = fmtNombre(v, d === undefined ? 2 : d);
  if (txt.indexOf(',') >= 0) txt = txt.replace(/0+$/, '').replace(/,$/, '');
  if (txt === '-0') txt = '0';
  return (v > 0 && txt !== '0' ? '+' : '') + txt + ' R';
}
function fmtFacteur(pf){
  if (pf === Infinity) return '∞';
  return fmtNombre(pf, 2);
}

// Lit ce qui est tape dans une case R : "3", "+3", "-1", "1,5", "2.5R", "−0,5 r".
// Case vide -> null. Ce qui ne se lit pas ("1:3", "abc") -> NaN.
function lireR(txt){
  if (typeof txt === 'number') return isFinite(txt) ? txt : NaN;
  var s = String(txt === undefined || txt === null ? '' : txt)
    .replace(/\s+/g, '').replace(/[−–—]/g, '-').replace(/r$/i, '').replace(',', '.');
  if (!s) return null;
  if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  var v = parseFloat(s);
  return estZero(v) ? 0 : v;
}

// ---------- dates du replay (texte "AAAA-MM-JJ", jamais de fuseau) ----------
function deuxChiffres(n){ return (n < 10 ? '0' : '') + n; }
function cleDepuisUTC(d){ return d.getUTCFullYear() + '-' + deuxChiffres(d.getUTCMonth() + 1) + '-' + deuxChiffres(d.getUTCDate()); }
function dateUTC(cle){
  var p = String(cle).split('-');
  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
}
function dateValide(cle){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(cle || ''))) return false;
  return cleDepuisUTC(dateUTC(cle)) === cle;
}
function jourSemaine(cle){ return dateUTC(cle).getUTCDay(); }
function ajouterJours(cle, n){
  var d = dateUTC(cle);
  d.setUTCDate(d.getUTCDate() + n);
  return cleDepuisUTC(d);
}
// jour de bourse suivant (sens = 1) ou precedent (sens = -1) : on saute samedi et dimanche
function jourOuvrable(cle, sens){
  var c = ajouterJours(cle, sens);
  while (jourSemaine(c) === 0 || jourSemaine(c) === 6) c = ajouterJours(c, sens);
  return c;
}
function estWeekend(cle){ var j = jourSemaine(cle); return j === 0 || j === 6; }
// nombre de jours du lundi au vendredi entre deux dates, bornes comprises
function joursOuvrables(debut, fin){
  if (!dateValide(debut) || !dateValide(fin) || fin < debut) return 0;
  var n = 0, c = debut, garde = 0;
  while (c <= fin && garde++ < 40000) {
    if (!estWeekend(c)) n++;
    c = ajouterJours(c, 1);
  }
  return n;
}
// lundi de la semaine du jour donne : sert a regrouper par semaine
function lundiDe(cle){
  var j = jourSemaine(cle);
  return ajouterJours(cle, j === 0 ? -6 : 1 - j);
}
function minutesDe(heure){
  var m = String(heure || '').match(/^(\d{1,2})[:h](\d{2})/);
  if (!m) return null;
  var h = +m[1], mn = +m[2];
  if (h > 23 || mn > 59) return null;
  return h * 60 + mn;
}
function heureNormale(heure){
  var m = minutesDe(heure);
  if (m === null) return '';
  return deuxChiffres(Math.floor(m / 60)) + ':' + deuxChiffres(m % 60);
}

// "Asie 18:00-00:00" -> { nom, debut: 1080, fin: 0 }. Les lignes illisibles sont ignorees.
// Heures acceptees : "09:30", "9h30", "9h", "11".
function lireSeances(txt){
  return String(txt || '').split(/\r?\n/).map(function(l){
    var m = l.trim().match(/^(.*?)\s*:?\s+(\d{1,2})(?:[:h](\d{2})?)?\s*(?:-|–|à|a)\s*(\d{1,2})(?:[:h](\d{2})?)?\s*$/);
    if (!m || !m[1].trim()) return null;
    if (+m[2] > 24 || +m[4] > 24 || +(m[3] || 0) > 59 || +(m[5] || 0) > 59) return null;
    var d = (+m[2]) * 60 + (+(m[3] || 0)), f = (+m[4]) * 60 + (+(m[5] || 0));
    if (d > 1440 || f > 1440) return null;
    return { nom: m[1].trim(), debut: d % 1440, fin: f % 1440 };
  }).filter(Boolean);
}
// la seance qui contient l'heure ; une seance qui passe minuit (18:00-00:00) est geree
function seanceDe(heure, seances){
  var m = minutesDe(heure);
  if (m === null) return 'Heure non notée';
  for (var i = 0; i < seances.length; i++) {
    var s = seances[i];
    if (s.debut === s.fin) continue;
    if (s.debut < s.fin ? (m >= s.debut && m < s.fin) : (m >= s.debut || m < s.fin)) return s.nom;
  }
  return 'Hors séance';
}
// tranche d'une heure : "09 h"
function trancheHeure(heure){
  var m = minutesDe(heure);
  if (m === null) return 'Heure non notée';
  return deuxChiffres(Math.floor(m / 60)) + ' h';
}
// tranche de 30 minutes : "09:30"
function trancheDemiHeure(heure){
  var m = minutesDe(heure);
  if (m === null) return 'Heure non notée';
  var d = Math.floor(m / 30) * 30;
  return deuxChiffres(Math.floor(d / 60)) + ':' + deuxChiffres(d % 60);
}

// ---------- le R d'un trade ----------
// Distance du stop en points ; null si les prix manquent.
function pointsDeStop(t){
  if (!t || !estNombre(t.entree) || !estNombre(t.stop)) return null;
  var d = Math.abs(t.entree - t.stop);
  return d > 0 ? d : null;
}
// R d'une sortie a un prix donne. Long : (sortie - entree) / (entree - stop).
function rDepuisPrix(sens, entree, stop, sortie){
  if (!estNombre(entree) || !estNombre(stop) || !estNombre(sortie)) return null;
  var risque = Math.abs(entree - stop);
  if (!(risque > 0)) return null;
  // un stop du mauvais cote de l'entree est une faute de frappe, pas un trade
  if (sens === 'long' && stop > entree) return null;
  if (sens === 'short' && stop < entree) return null;
  var gain = sens === 'short' ? entree - sortie : sortie - entree;
  return arrondi(gain / risque, 4);
}
// R:R vise depuis les prix : distance de la cible / distance du stop.
function rrDepuisPrix(sens, entree, stop, cible){
  var r = rDepuisPrix(sens, entree, stop, cible);
  return r !== null && r > 0 ? r : null;
}
// Le resultat du trade en R, selon l'issue choisie :
//   tp -> le R:R vise ; sl -> -1 ; be -> 0 ; autre -> le R ecrit (sortie manuelle, partiel...)
function rDuTrade(t){
  if (!t) return null;
  if (t.issue === 'sl') return -1;
  if (t.issue === 'be') return 0;
  if (t.issue === 'tp') {
    if (estNombre(t.rrCible) && t.rrCible > 0) return t.rrCible;
    return estNombre(t.r) ? t.r : null;
  }
  return estNombre(t.r) ? t.r : null;
}
// Toutes les etapes obligatoires de la strategie sont cochees ?
function estConforme(t, confluences){
  var obl = (confluences || []).filter(function(c){ return c.obligatoire; });
  if (!obl.length) return true;
  var c = (t && t.confl) || {};
  return obl.every(function(o){ return !!c[o.id]; });
}
function nbConfluencesCochees(t, confluences){
  var c = (t && t.confl) || {};
  return (confluences || []).filter(function(x){ return !!c[x.id]; }).length;
}
// Le trade va-t-il dans le sens du biais du jour ?
function relationBiais(t){
  if (!t || !t.biais) return 'Biais non noté';
  if (t.biais === 'neutre') return 'Biais neutre';
  if ((t.biais === 'haussier' && t.sens === 'long') || (t.biais === 'baissier' && t.sens === 'short')) return 'Dans le sens du biais';
  return 'Contre le biais';
}
function trancheStop(pts){
  if (!estNombre(pts)) return 'Prix non notés';
  if (pts < 10) return 'moins de 10 pts';
  if (pts < 20) return '10 à 20 pts';
  if (pts < 30) return '20 à 30 pts';
  if (pts < 50) return '30 à 50 pts';
  if (pts < 100) return '50 à 100 pts';
  return '100 pts et plus';
}
var ORDRE_TRANCHES_STOP = ['moins de 10 pts', '10 à 20 pts', '20 à 30 pts', '30 à 50 pts', '50 à 100 pts', '100 pts et plus', 'Prix non notés'];
function trancheDuree(min){
  if (!estNombre(min)) return 'Durée non notée';
  if (min < 5) return 'moins de 5 min';
  if (min < 15) return '5 à 15 min';
  if (min < 30) return '15 à 30 min';
  if (min < 60) return '30 à 60 min';
  if (min < 120) return '1 à 2 h';
  return '2 h et plus';
}
var ORDRE_TRANCHES_DUREE = ['moins de 5 min', '5 à 15 min', '15 à 30 min', '30 à 60 min', '1 à 2 h', '2 h et plus', 'Durée non notée'];

// ordre chronologique du replay : date, heure, puis ordre de saisie
function cleChrono(t){ return (t.date || '0000-00-00') + ' ' + (heureNormale(t.heure) || '99:99') + ' ' + String(1e13 + (t.cree || 0)); }
function trierChrono(trades){
  return (trades || []).slice().sort(function(a, b){
    var x = cleChrono(a), y = cleChrono(b);
    return x < y ? -1 : (x > y ? 1 : 0);
  });
}

// ---------- statistiques en R ----------
// Taux de reussite = gagnants / (gagnants + perdants) : les BE ne comptent ni pour
// ni contre, comme dans le journal. L'esperance, elle, divise par TOUS les trades.
// Une serie de pertes s'arrete au premier trade qui n'est pas perdant (BE compris).
function statsR(trades){
  var liste = trierChrono(trades);
  var s = {
    nb: 0, nbSansR: 0, total: 0, moyenne: null, mediane: null,
    nbG: 0, nbP: 0, nbBE: 0, sommeG: 0, sommeP: 0,
    tauxReussite: null, moyG: null, moyP: null, facteurProfit: null,
    ecartType: null, ddMax: 0, ddDebut: null, ddFin: null,
    serieP: 0, serieG: 0, meilleur: null, pire: null,
    seuilRentabilite: null, sqn: null, courbe: [], valeurs: []
  };
  var cumul = 0, sommet = 0, iSommet = -1, sp = 0, sg = 0;
  liste.forEach(function(t){
    var r = rDuTrade(t);
    if (r === null) { s.nbSansR++; return; }
    s.nb++;
    s.valeurs.push(r);
    cumul += r;
    if (r > EPS) { s.nbG++; s.sommeG += r; sg++; sp = 0; }
    else if (r < -EPS) { s.nbP++; s.sommeP += r; sp++; sg = 0; }
    else { s.nbBE++; sp = 0; sg = 0; }
    if (sp > s.serieP) s.serieP = sp;
    if (sg > s.serieG) s.serieG = sg;
    if (!s.meilleur || r > s.meilleur.r) s.meilleur = { r: r, id: t.id, date: t.date };
    if (!s.pire || r < s.pire.r) s.pire = { r: r, id: t.id, date: t.date };
    var idx = s.courbe.length;
    s.courbe.push({ i: idx, cumul: arrondi(cumul), r: r, id: t.id, date: t.date, heure: t.heure || '' });
    if (cumul > sommet + EPS) { sommet = cumul; iSommet = idx; }
    if (sommet - cumul > s.ddMax + EPS) { s.ddMax = arrondi(sommet - cumul); s.ddDebut = iSommet; s.ddFin = idx; }
  });
  s.total = arrondi(cumul);
  s.sommeG = arrondi(s.sommeG); s.sommeP = arrondi(s.sommeP);
  if (s.nb) {
    s.moyenne = s.total / s.nb;
    var tri = s.valeurs.slice().sort(function(a, b){ return a - b; });
    var mil = Math.floor(tri.length / 2);
    s.mediane = tri.length % 2 ? tri[mil] : (tri[mil - 1] + tri[mil]) / 2;
  }
  if (s.nbG + s.nbP) s.tauxReussite = s.nbG / (s.nbG + s.nbP);
  if (s.nbG) s.moyG = s.sommeG / s.nbG;
  if (s.nbP) s.moyP = s.sommeP / s.nbP;
  if (s.nbP) s.facteurProfit = s.sommeG / Math.abs(s.sommeP);
  else if (s.nbG) s.facteurProfit = Infinity;
  if (s.nb >= 2) {
    var m = s.moyenne;
    var v = s.valeurs.reduce(function(a, x){ return a + (x - m) * (x - m); }, 0) / (s.nb - 1);
    s.ecartType = Math.sqrt(v);
    // SQN de Van Tharp : racine(n) x esperance / ecart-type, n plafonne a 100
    if (s.ecartType > EPS) s.sqn = Math.sqrt(Math.min(s.nb, 100)) * m / s.ecartType;
  }
  // taux de reussite qui suffit pour ne rien perdre avec ces gains et ces pertes moyens
  if (s.moyG !== null && s.moyP !== null && Math.abs(s.moyP) > EPS) {
    s.seuilRentabilite = 1 / (1 + s.moyG / Math.abs(s.moyP));
  }
  return s;
}

// ---------- fiabilite de l'echantillon ----------
// Valeurs critiques de la loi de Student a 95 % (bilateral), par degres de liberte.
var T_CRIT_95 = { 1: 12.706, 2: 4.303, 3: 3.182, 4: 2.776, 5: 2.571, 6: 2.447, 7: 2.365, 8: 2.306, 9: 2.262,
  10: 2.228, 11: 2.201, 12: 2.179, 13: 2.160, 14: 2.145, 15: 2.131, 16: 2.120, 17: 2.110, 18: 2.101, 19: 2.093,
  20: 2.086, 21: 2.080, 22: 2.074, 23: 2.069, 24: 2.064, 25: 2.060, 26: 2.056, 27: 2.052, 28: 2.048, 29: 2.045,
  30: 2.042, 40: 2.021, 50: 2.009, 60: 2.000, 80: 1.990, 100: 1.984, 120: 1.980 };
function tCritique(df){
  if (df < 1) return null;
  if (T_CRIT_95[df]) return T_CRIT_95[df];
  if (df > 120) return 1.96;
  var cles = Object.keys(T_CRIT_95).map(Number).sort(function(a, b){ return a - b; });
  var k = cles[0];
  for (var i = 0; i < cles.length; i++) if (cles[i] <= df) k = cles[i];
  return T_CRIT_95[k];   // degre inferieur : un peu plus large, donc prudent
}
// Fourchette ou se trouve probablement la vraie esperance (95 %).
function intervalle95(valeurs){
  var n = valeurs.length;
  if (n < 2) return null;
  var m = somme(valeurs) / n;
  var v = valeurs.reduce(function(a, x){ return a + (x - m) * (x - m); }, 0) / (n - 1);
  var sd = Math.sqrt(v), se = sd / Math.sqrt(n), t = tCritique(n - 1);
  return { n: n, moyenne: m, ecartType: sd, erreur: se, bas: m - t * se, haut: m + t * se,
           tStat: se > EPS ? m / se : null };
}
// Trades a prendre pour que la fourchette a 95 % ne touche plus zero, si l'esperance
// et la dispersion restent celles d'aujourd'hui.
function tradesNecessaires(moyenne, ecartType){
  if (!(moyenne > EPS) || !(ecartType > EPS)) return null;
  return Math.ceil(Math.pow(1.96 * ecartType / moyenne, 2));
}
// Generateur pseudo-aleatoire a graine (mulberry32) : la meme graine donne les
// memes tirages, donc les memes resultats d'une fois a l'autre et dans les tests.
function aleatoire(graine){
  var a = (graine >>> 0) || 1;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function tirer(liste, rng){ return liste[Math.floor(rng() * liste.length)]; }
// Part des tirages (avec remise) de tes propres trades dont la moyenne est positive.
function bootstrapPositif(valeurs, nTirages, rng){
  var n = valeurs.length;
  if (n < 2) return null;
  var pos = 0;
  for (var k = 0; k < nTirages; k++) {
    var s = 0;
    for (var i = 0; i < n; i++) s += valeurs[Math.floor(rng() * n)];
    if (s > EPS) pos++;
  }
  return pos / nTirages;
}
function centile(triees, p){
  if (!triees.length) return null;
  var i = (triees.length - 1) * p, b = Math.floor(i), h = Math.ceil(i);
  return triees[b] + (triees[h] - triees[b]) * (i - b);
}

// ---------- regroupements ----------
// cleDe(t) peut rendre une valeur ou une liste (un trade a plusieurs etiquettes).
function grouperR(trades, cleDe, ordre){
  var g = {};
  trades.forEach(function(t){
    var c = cleDe(t);
    (Array.isArray(c) ? c : [c]).forEach(function(k){
      if (k === null || k === undefined || k === '') return;
      (g[k] = g[k] || []).push(t);
    });
  });
  var cles = Object.keys(g);
  if (ordre) {
    cles.sort(function(a, b){
      var ia = ordre.indexOf(a), ib = ordre.indexOf(b);
      if (ia < 0) ia = 9999; if (ib < 0) ib = 9999;
      return ia - ib || (a < b ? -1 : 1);
    });
  } else cles.sort();
  return cles.map(function(k){ return { cle: k, trades: g[k], stats: statsR(g[k]) }; });
}
// Pour chaque confluence : les trades qui l'ont contre ceux qui ne l'ont pas.
function analyseConfluences(trades, confluences){
  return (confluences || []).map(function(c){
    var avec = [], sans = [];
    trades.forEach(function(t){ ((t.confl || {})[c.id] ? avec : sans).push(t); });
    var sa = statsR(avec), ss = statsR(sans);
    return {
      id: c.id, nom: c.nom, obligatoire: !!c.obligatoire,
      avec: sa, sans: ss,
      ecart: (sa.moyenne !== null && ss.moyenne !== null) ? sa.moyenne - ss.moyenne : null
    };
  });
}

// ---------- frequence ----------
// joursTestes : liste de cles "campagne|date" de tous les jours passes en replay,
// y compris ceux sans setup. Sans eux, impossible de savoir combien de trades par
// semaine la strategie donne vraiment.
function frequence(trades, joursTestes){
  var parJour = {};
  (joursTestes || []).forEach(function(k){ parJour[k] = parJour[k] || 0; });
  trades.forEach(function(t){
    var k = (t.campagneId || '') + '|' + t.date;
    parJour[k] = (parJour[k] || 0) + 1;
  });
  var cles = Object.keys(parJour);
  var nbJours = cles.length, nbTrades = trades.length;
  var listeParJour = cles.map(function(k){ return parJour[k]; });
  var dist = {};
  listeParJour.forEach(function(n){ dist[n] = (dist[n] || 0) + 1; });
  var avec = listeParJour.filter(function(n){ return n > 0; }).length;
  return {
    nbJours: nbJours, nbTrades: nbTrades,
    parJour: nbJours ? nbTrades / nbJours : null,
    parSemaine: nbJours ? 5 * nbTrades / nbJours : null,
    joursAvecTrade: avec,
    partJoursAvecTrade: nbJours ? avec / nbJours : null,
    distribution: dist,
    listeParJour: listeParJour
  };
}

// ---------- et si j'avais gere la sortie autrement ? ----------
// Il faut le MFE : jusqu'ou le prix est alle en ta faveur, en R, AVANT de toucher
// ton stop (ou avant la fin de la seance). Pour un stop plus serre, il faut aussi le
// MAE : jusqu'ou il est alle contre toi, en R (1 = ton stop d'origine).
// regle = { cible, be (null ou R qui declenche le BE), stopFrac (1 = stop d'origine),
//           partiel (null ou { a: R du partiel, part: 0.5 }) }
// Hypothese PRUDENTE : si la cible n'est pas atteinte, le trade finit au stop,
// ou au point mort si la regle BE s'est declenchee. On ne sait pas mieux.
function issueSimulee(t, regle){
  if (!t || !estNombre(t.mfe) || t.mfe < 0) return null;
  var f = regle.stopFrac || 1;
  if (f < 1 - EPS) {
    if (!estNombre(t.mae) || t.mae < 0) return null;
    if (t.mae >= f - EPS) return -1;          // le stop serre est touche
  }
  var m = t.mfe / f;                            // le MFE exprime dans le nouveau R
  if (regle.partiel) {
    var a = regle.partiel.a, part = regle.partiel.part;
    if (m >= a - EPS) return arrondi(part * a + (1 - part) * (m >= regle.cible - EPS ? regle.cible : 0));
    return -1;
  }
  if (m >= regle.cible - EPS) return regle.cible;
  if (regle.be !== null && regle.be !== undefined && m >= regle.be - EPS) return 0;
  return -1;
}
function statsRegle(trades, regle){
  var vals = [], nbIgnores = 0;
  trades.forEach(function(t){
    var r = issueSimulee(t, regle);
    if (r === null) nbIgnores++; else vals.push({ id: t.id, date: t.date, heure: t.heure, cree: t.cree, issue: 'autre', r: r });
  });
  var s = statsR(vals);
  s.nbIgnores = nbIgnores;
  return s;
}
function grilleSorties(trades, cibles, bes){
  var avecMfe = trades.filter(function(t){ return estNombre(t.mfe) && t.mfe >= 0; });
  var meilleur = null;
  var lignes = bes.map(function(be){
    return {
      be: be,
      cellules: cibles.map(function(c){
        if (be !== null && be >= c - EPS) return { cible: c, stats: null };
        var s = statsRegle(avecMfe, { cible: c, be: be, stopFrac: 1 });
        if (s.nb && (!meilleur || s.moyenne > meilleur.stats.moyenne + EPS)) meilleur = { cible: c, be: be, stats: s };
        return { cible: c, stats: s };
      })
    };
  });
  return { nb: avecMfe.length, nbSansMfe: trades.length - avecMfe.length, lignes: lignes, meilleur: meilleur,
           reel: statsR(avecMfe) };
}
// part des trades dont le prix a atteint au moins L R en ta faveur
function atteintes(trades, niveaux){
  var avec = trades.filter(function(t){ return estNombre(t.mfe) && t.mfe >= 0; });
  return niveaux.map(function(L){
    var n = avec.filter(function(t){ return t.mfe >= L - EPS; }).length;
    return { niveau: L, nb: n, part: avec.length ? n / avec.length : null };
  });
}
function balayageStop(trades, cible, fracs){
  var avec = trades.filter(function(t){ return estNombre(t.mfe) && estNombre(t.mae); });
  return fracs.map(function(f){ return { frac: f, stats: statsRegle(avec, { cible: cible, be: null, stopFrac: f }) }; });
}

// ---------- simulateur de challenge (Monte-Carlo) ----------
// On rejoue des journees au hasard en tirant dans TES trades (avec remise) et dans
// TES journees testees (combien de trades par jour, zero compris).
// p = { capital, risque ($ par R), frais ($ par trade), objectif, perteMax,
//       suiveuse (le plancher suit le plus haut solde de fin de journee),
//       bloqueAuDepart (le plancher ne depasse jamais le solde de depart),
//       perteJour (null ou $), perteJourElimine (true : le compte est perdu ; false : la journee s'arrete),
//       constance (null ou 0.4 : aucun jour ne doit faire plus de 40 % du profit),
//       joursMin, joursMax, maxTradesJour (null ou n), stopJourR (null ou R perdus), decoteR, nSim }
function simulerChallenge(rs, tradesParJour, p, rng){
  if (!rs || !rs.length || !tradesParJour || !tradesParJour.length) return null;
  var nSim = p.nSim || 2000, joursMax = p.joursMax || 120;
  var res = { nSim: nSim, nbReussite: 0, nbEchec: 0, nbInacheve: 0,
              joursReussite: [], joursEchec: [], causes: { plancher: 0, perteJour: 0 },
              bloqueParConstance: 0, soldesFin: [] };
  for (var s = 0; s < nSim; s++) {
    var solde = p.capital, haut = p.capital, plancher = p.capital - p.perteMax;
    var meilleurJour = 0, joursTrades = 0, issue = null, jourFin = 0, freineConstance = false;
    for (var d = 1; d <= joursMax && !issue; d++) {
      jourFin = d;
      var n = tirer(tradesParJour, rng);
      if (p.maxTradesJour) n = Math.min(n, p.maxTradesJour);
      var pj = 0, rj = 0;
      for (var k = 0; k < n; k++) {
        var r = tirer(rs, rng) - (p.decoteR || 0);
        var gain = r * p.risque - (p.frais || 0);
        solde += gain; pj += gain; rj += r;
        if (solde <= plancher + EPS) { issue = 'echec'; res.causes.plancher++; break; }
        if (p.perteJour && pj <= -p.perteJour + EPS) {
          if (p.perteJourElimine) { issue = 'echec'; res.causes.perteJour++; }
          break;
        }
        if (p.stopJourR && rj <= -p.stopJourR + EPS) break;
      }
      if (n > 0) joursTrades++;
      if (pj > meilleurJour) meilleurJour = pj;
      if (issue) break;
      // fin de journee : le plancher suit le plus haut solde de cloture
      if (p.suiveuse) {
        if (solde > haut) haut = solde;
        plancher = Math.max(plancher, haut - p.perteMax);
        if (p.bloqueAuDepart) plancher = Math.min(plancher, p.capital);
      }
      var profit = solde - p.capital;
      if (profit >= p.objectif - EPS && joursTrades >= (p.joursMin || 0)) {
        if (p.constance && meilleurJour > p.constance * profit + EPS) freineConstance = true;
        else issue = 'reussite';
      }
    }
    if (issue === 'reussite') { res.nbReussite++; res.joursReussite.push(jourFin); if (freineConstance) res.bloqueParConstance++; }
    else if (issue === 'echec') { res.nbEchec++; res.joursEchec.push(jourFin); }
    else res.nbInacheve++;
    res.soldesFin.push(solde - p.capital);
  }
  res.reussite = res.nbReussite / nSim;
  res.echec = res.nbEchec / nSim;
  res.inacheve = res.nbInacheve / nSim;
  var jr = res.joursReussite.slice().sort(function(a, b){ return a - b; });
  var je = res.joursEchec.slice().sort(function(a, b){ return a - b; });
  res.joursMedianReussite = centile(jr, 0.5);
  res.joursP25 = centile(jr, 0.25);
  res.joursP75 = centile(jr, 0.75);
  res.joursMedianEchec = centile(je, 0.5);
  // esperance en $ d'une tentative : utile pour comparer au prix du challenge
  return res;
}
function balayageRisque(rs, tradesParJour, p, risques, graine){
  return risques.map(function(rq, i){
    var q = Object.assign({}, p, { risque: rq });
    var r = simulerChallenge(rs, tradesParJour, q, aleatoire((graine || 1) + i * 7919));
    return { risque: rq, sim: r };
  });
}
// Les 100 prochains trades : eventail des courbes possibles, recul et series de pertes.
function eventailR(rs, nTrades, nSim, rng, decoteR){
  if (!rs || !rs.length) return null;
  var parPas = [];
  for (var i = 0; i < nTrades; i++) parPas.push(new Float64Array(nSim));
  var dds = [], series = [], finaux = [];
  for (var s = 0; s < nSim; s++) {
    var c = 0, sommet = 0, dd = 0, sp = 0, spMax = 0;
    for (var k = 0; k < nTrades; k++) {
      var r = tirer(rs, rng) - (decoteR || 0);
      c += r;
      if (c > sommet) sommet = c;
      if (sommet - c > dd) dd = sommet - c;
      if (r < -EPS) { sp++; if (sp > spMax) spMax = sp; } else sp = 0;
      parPas[k][s] = c;
    }
    dds.push(dd); series.push(spMax); finaux.push(c);
  }
  var bandes = parPas.map(function(col, k){
    var t = Array.prototype.slice.call(col).sort(function(a, b){ return a - b; });
    return { k: k + 1, p5: centile(t, 0.05), p25: centile(t, 0.25), p50: centile(t, 0.5), p75: centile(t, 0.75), p95: centile(t, 0.95) };
  });
  dds.sort(function(a, b){ return a - b; });
  series.sort(function(a, b){ return a - b; });
  finaux.sort(function(a, b){ return a - b; });
  var partSeries = {};
  [3, 4, 5, 6, 7, 8, 10].forEach(function(L){
    partSeries[L] = series.filter(function(x){ return x >= L; }).length / nSim;
  });
  return {
    nTrades: nTrades, nSim: nSim, bandes: bandes,
    ddMedian: centile(dds, 0.5), dd95: centile(dds, 0.95),
    serieMediane: centile(series, 0.5), serie95: centile(series, 0.95),
    partSeries: partSeries,
    partFinalNegatif: finaux.filter(function(x){ return x < 0; }).length / nSim,
    finalMedian: centile(finaux, 0.5)
  };
}

// ---------- lecture des fichiers ----------
// Analyseur CSV maison : guillemets, guillemets doubles echappes, retours de ligne
// dans les champs, separateur virgule / point-virgule / tabulation.
function detecterSeparateur(t){
  var premiere = t.split(/\r?\n/)[0] || '';
  var cands = [',', ';', '\t', '|'], meilleur = ',', max = -1;
  cands.forEach(function(c){
    var n = premiere.split(c).length - 1;
    if (n > max) { max = n; meilleur = c; }
  });
  return meilleur;
}
function parserCSV(texte){
  var t = String(texte).replace(/^﻿/, '');
  var sep = detecterSeparateur(t);
  var lignes = [], champ = '', ligne = [], dansGuillemets = false;
  for (var i = 0; i < t.length; i++) {
    var c = t[i];
    if (dansGuillemets) {
      if (c === '"') {
        if (t[i + 1] === '"') { champ += '"'; i++; }
        else dansGuillemets = false;
      } else champ += c;
    } else if (c === '"') {
      dansGuillemets = true;
    } else if (c === sep) {
      ligne.push(champ); champ = '';
    } else if (c === '\n') {
      ligne.push(champ); champ = '';
      if (ligne.some(function(x){ return String(x).trim() !== ''; })) lignes.push(ligne);
      ligne = [];
    } else if (c !== '\r') champ += c;
  }
  ligne.push(champ);
  if (ligne.some(function(x){ return String(x).trim() !== ''; })) lignes.push(ligne);
  return lignes;
}
// Ordre jour/mois d'une colonne de dates "12/03/2025" : on regarde toute la colonne.
// 'jm' = jour/mois (francais), 'mj' = mois/jour (anglais). Ambigu -> francais.
function detecterOrdreDates(valeurs){
  var jm = false, mj = false;
  valeurs.forEach(function(v){
    var m = String(v || '').trim().match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
    if (!m) return;
    if (+m[1] > 12) jm = true;
    if (+m[2] > 12) mj = true;
  });
  if (mj && !jm) return 'mj';
  return 'jm';
}
// "2025-03-12 09:42", "2025-03-12T09:42:00", "12/03/2025 09:42", numero de serie Excel...
// -> { date: "2025-03-12", heure: "09:42" } ; heure "" si absente ; null si illisible.
// AUCUNE conversion de fuseau : l'heure ecrite est l'heure du graphique.
function separerDateHeure(v, ordre){
  if (v === null || v === undefined) return null;
  if (typeof v === 'number' || /^\d{5}(\.\d+)?$/.test(String(v).trim())) {
    var serie = +v;
    if (!(serie > 20000 && serie < 80000)) return null;
    var ms = Math.round((serie - 25569) * 86400000);   // 25569 = 1er janvier 1970 en serie Excel
    var d = new Date(ms);
    var h = d.getUTCHours(), mn = d.getUTCMinutes();
    return { date: cleDepuisUTC(d), heure: (h || mn || (serie % 1)) ? deuxChiffres(h) + ':' + deuxChiffres(mn) : '' };
  }
  var s = String(v).trim();
  if (!s) return null;
  var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ,]+(\d{1,2}):(\d{2})(?::\d{2}(?:\.\d+)?)?)?/);
  var date = null, heure = '';
  if (m) {
    date = m[1] + '-' + deuxChiffres(+m[2]) + '-' + deuxChiffres(+m[3]);
    if (m[4] !== undefined) heure = deuxChiffres(+m[4]) + ':' + m[5];
  } else {
    m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})(?:[ ,T]+(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?)?/);
    if (!m) return null;
    var a = +m[1], b = +m[2], jour, mois;
    if (ordre === 'mj') { mois = a; jour = b; } else { jour = a; mois = b; }
    if (mois > 12 && jour <= 12) { var x = jour; jour = mois; mois = x; }
    var an = +m[3]; if (an < 100) an += 2000;
    date = an + '-' + deuxChiffres(mois) + '-' + deuxChiffres(jour);
    if (m[4] !== undefined) {
      var hh = +m[4];
      if (m[6]) { var pm = /p/i.test(m[6]); if (pm && hh < 12) hh += 12; if (!pm && hh === 12) hh = 0; }
      heure = deuxChiffres(hh) + ':' + m[5];
    }
  }
  if (!dateValide(date)) return null;
  if (heure && minutesDe(heure) === null) heure = '';
  return { date: date, heure: heure };
}
function sensDepuisTexte(v){
  var s = normaliserTexte(v);
  if (!s) return null;
  if (s === 'l' || s === 'b' || /^(long|buy|achat|acheteur|haussier|bull)/.test(s) || s.indexOf('entrylong') >= 0 || s.indexOf('exitlong') >= 0) return 'long';
  if (s === 's' || /^(short|sell|vente|vendeur|baissier|bear)/.test(s) || s.indexOf('entryshort') >= 0 || s.indexOf('exitshort') >= 0) return 'short';
  // "Entree long", "Sortie short" (TradingView en francais)
  if (s.indexOf('short') >= 0) return 'short';
  if (s.indexOf('long') >= 0) return 'long';
  return null;
}
function issueDepuisTexte(v){
  var s = normaliserTexte(v);
  if (!s) return null;
  if (/^(tp|win|gagn|takeprofit|target|cible|w$)/.test(s)) return 'tp';
  if (/^(sl|loss|perd|stop|l$)/.test(s)) return 'sl';
  if (/^(be|breakeven|pointmort|neutre|scratch)/.test(s)) return 'be';
  return null;
}

// ---------- TradingView : liste des trades du testeur de strategie ----------
// Chaque trade y prend deux lignes (Entry / Exit) avec le meme numero. Les noms des
// colonnes changent selon la version (Profit USD, Net P&L USD...) : on les reconnait
// par leur debut, en ecartant les colonnes en pourcentage.
function colonneTV(entetes, debuts, sauf){
  for (var d = 0; d < debuts.length; d++) {
    for (var i = 0; i < entetes.length; i++) {
      var brut = String(entetes[i] || '');
      if (brut.indexOf('%') >= 0) continue;
      var n = normaliserTexte(brut);
      if (sauf && sauf.some(function(x){ return n.indexOf(x) >= 0; })) continue;
      if (n.indexOf(debuts[d]) === 0) return i;
    }
  }
  return -1;
}
function colonnesTV(entetes){
  return {
    num: colonneTV(entetes, ['trade', 'tradeno', 'ndetrade', 'notrade', 'numerodetrade', 'numero']),
    type: colonneTV(entetes, ['type']),
    date: colonneTV(entetes, ['datetime', 'dateandtime', 'dateheure', 'date', 'time']),
    prix: colonneTV(entetes, ['price', 'prix']),
    profit: colonneTV(entetes, ['netpl', 'netprofit', 'profit', 'pnl', 'plnet', 'pnlnet', 'resultatnet', 'gainnet'], ['cumul']),
    runup: colonneTV(entetes, ['runup', 'maxrunup', 'favorable']),
    drawdown: colonneTV(entetes, ['drawdown', 'maxdrawdown', 'adverse']),
    qte: colonneTV(entetes, ['contracts', 'positionsizeqty', 'quantity', 'qty', 'quantite']),
    signal: colonneTV(entetes, ['signal'])
  };
}
function estListeTradesTV(entetes){
  var c = colonnesTV(entetes);
  return c.num >= 0 && c.type >= 0 && c.date >= 0 && c.profit >= 0;
}
// unR = combien de dollars vaut 1 R (le risque de chaque trade du script).
function lireListeTradesTV(lignes, unR){
  var res = { trades: [], ignores: [], colonnes: null, pertes: [] };
  if (!lignes || lignes.length < 2) { res.erreur = 'Le fichier est vide.'; return res; }
  var ent = lignes[0], c = colonnesTV(ent);
  res.colonnes = c;
  if (c.num < 0 || c.type < 0 || c.date < 0 || c.profit < 0) {
    res.erreur = 'Ce n\'est pas la liste des trades du testeur de stratégie (colonnes Trade #, Type, Date et Profit introuvables).';
    return res;
  }
  var dates = lignes.slice(1).map(function(l){ return l[c.date]; });
  var ordre = detecterOrdreDates(dates);
  var groupes = {}, ordreNums = [];
  lignes.slice(1).forEach(function(l, i){
    var num = String(l[c.num] || '').trim();
    if (!num) { res.ignores.push({ ligne: i + 2, raison: 'sans numéro de trade' }); return; }
    if (!groupes[num]) { groupes[num] = []; ordreNums.push(num); }
    groupes[num].push(l);
  });
  ordreNums.forEach(function(num){
    var g = groupes[num], entree = null, sortie = null;
    g.forEach(function(l){
      var ty = normaliserTexte(l[c.type]);
      if (ty.indexOf('entry') >= 0 || ty.indexOf('entree') >= 0) entree = l;
      else if (ty.indexOf('exit') >= 0 || ty.indexOf('sortie') >= 0) sortie = l;
    });
    if (!entree || !sortie) { res.ignores.push({ ligne: num, raison: 'trade sans entrée ou sans sortie' }); return; }
    if (c.signal >= 0 && normaliserTexte(sortie[c.signal]) === 'open') { res.ignores.push({ ligne: num, raison: 'trade encore ouvert' }); return; }
    var sens = sensDepuisTexte(entree[c.type]) || sensDepuisTexte(sortie[c.type]);
    var dh = separerDateHeure(entree[c.date], ordre);
    var dhS = separerDateHeure(sortie[c.date], ordre);
    var profit = versNombre(sortie[c.profit]);
    if (profit === null || estZero(profit)) { var pe = versNombre(entree[c.profit]); if (pe !== null) profit = pe; }
    if (!dh || profit === null || !sens) { res.ignores.push({ ligne: num, raison: 'date, sens ou profit illisible' }); return; }
    var ru = c.runup >= 0 ? (versNombre(sortie[c.runup]) !== null ? versNombre(sortie[c.runup]) : versNombre(entree[c.runup])) : null;
    var dd = c.drawdown >= 0 ? (versNombre(sortie[c.drawdown]) !== null ? versNombre(sortie[c.drawdown]) : versNombre(entree[c.drawdown])) : null;
    if (profit < 0) res.pertes.push(-profit);
    var duree = null;
    if (dhS && dhS.heure && dh.heure) {
      var j = (dateUTC(dhS.date) - dateUTC(dh.date)) / 86400000;
      duree = j * 1440 + minutesDe(dhS.heure) - minutesDe(dh.heure);
      if (duree < 0) duree = null;
    }
    res.trades.push({
      numTV: num, date: dh.date, heure: dh.heure, sens: sens,
      entree: c.prix >= 0 ? versNombre(entree[c.prix]) : null,
      sortie: c.prix >= 0 ? versNombre(sortie[c.prix]) : null,
      qte: c.qte >= 0 ? versNombre(entree[c.qte]) : null,
      profit: profit, runup: ru !== null ? Math.abs(ru) : null, drawdownTV: dd !== null ? Math.abs(dd) : null,
      duree: duree,
      issue: 'autre',
      r: unR > 0 ? arrondi(profit / unR, 3) : null,
      mfe: unR > 0 && ru !== null ? arrondi(Math.abs(ru) / unR, 3) : null,
      mae: unR > 0 && dd !== null ? arrondi(Math.abs(dd) / unR, 3) : null
    });
  });
  return res;
}
// Proposition pour 1 R quand on ne le connait pas : la perte mediane du fichier.
function proposerUnR(pertes){
  if (!pertes || !pertes.length) return null;
  var t = pertes.slice().sort(function(a, b){ return a - b; });
  return Math.round(centile(t, 0.5) * 100) / 100;
}

var ALIAS_GENERIQUES = {
  date:     ['date', 'jour', 'day', 'datetime', 'dateheure', 'dateandtime', 'entrytime', 'opentime', 'time', 'quand'],
  heure:    ['heure', 'hour', 'heureentree', 'entryhour', 'hora', 'time'],
  sens:     ['sens', 'side', 'direction', 'longshort', 'type', 'position', 'dir'],
  r:        ['r', 'resultatr', 'resultr', 'rmultiple', 'pnlr', 'gainr', 'rrealise', 'rresult', 'result', 'resultat', 'outcome'],
  issue:    ['issue', 'winloss', 'gagnantperdant', 'statut', 'status', 'tpsl'],
  rr:       ['rr', 'rrvise', 'rrcible', 'targetrr', 'riskreward', 'ratio', 'rrplanned', 'plannedrr'],
  mfe:      ['mfe', 'maxfavorable', 'maxr', 'rmax', 'maxenfaveur', 'runup'],
  mae:      ['mae', 'maxadverse', 'maxcontre', 'heat'],
  symbole:  ['symbole', 'symbol', 'instrument', 'ticker', 'actif', 'asset', 'pair', 'paire'],
  qualite:  ['qualite', 'quality', 'grade', 'setupgrade'],
  setup:    ['setup', 'modele', 'model', 'strategie', 'strategy', 'tag', 'tags', 'etiquette'],
  notes:    ['notes', 'note', 'commentaire', 'comment', 'comments', 'remarques'],
  entree:   ['entree', 'entry', 'entryprice', 'prixentree'],
  stop:     ['stop', 'sl', 'stoploss', 'stopprice'],
  sortie:   ['sortie', 'exit', 'exitprice', 'prixsortie']
};
function devinerColonnes(entetes){
  var norm = entetes.map(normaliserTexte), pris = {}, map = {};
  Object.keys(ALIAS_GENERIQUES).forEach(function(champ){
    var alias = ALIAS_GENERIQUES[champ], trouve = -1;
    for (var a = 0; a < alias.length && trouve < 0; a++) {
      for (var i = 0; i < norm.length; i++) {
        if (!pris[i] && norm[i] === alias[a]) { trouve = i; break; }
      }
    }
    if (trouve >= 0) { map[champ] = trouve; pris[trouve] = true; }
    else map[champ] = -1;
  });
  return map;
}
// lignes : tableau de tableaux (la premiere est l'entete) ; map : champ -> numero de colonne
// o = { rrDefaut, symbole }
function lireTableurGenerique(lignes, map, o){
  o = o || {};
  var res = { trades: [], ignores: [] };
  if (!lignes || lignes.length < 2) { res.erreur = 'Le fichier est vide.'; return res; }
  var col = function(l, champ){ var i = map[champ]; return (i === undefined || i < 0) ? '' : l[i]; };
  var ordre = detecterOrdreDates(lignes.slice(1).map(function(l){ return col(l, 'date'); }));
  lignes.slice(1).forEach(function(l, i){
    var n = i + 2;
    var dh = separerDateHeure(col(l, 'date'), ordre);
    if (!dh) { res.ignores.push({ ligne: n, raison: 'date illisible' }); return; }
    var h = heureNormale(col(l, 'heure'));
    if (h) dh.heure = h;
    var sens = sensDepuisTexte(col(l, 'sens'));
    var issue = issueDepuisTexte(col(l, 'issue'));
    var rTxt = col(l, 'r');
    var r = lireR(rTxt);
    if (r !== null && isNaN(r)) {
      // la colonne resultat contient peut-etre "TP", "SL", "BE"
      var iss = issueDepuisTexte(rTxt);
      if (iss && !issue) issue = iss;
      r = versNombre(rTxt);
    }
    var rr = versNombre(col(l, 'rr'));
    var entree = versNombre(col(l, 'entree')), stop = versNombre(col(l, 'stop')), sortie = versNombre(col(l, 'sortie'));
    if (r === null && sens && entree !== null && stop !== null && sortie !== null) r = rDepuisPrix(sens, entree, stop, sortie);
    var t = {
      date: dh.date, heure: dh.heure, sens: sens || 'long',
      issue: 'autre', r: null, rrCible: rr !== null && rr > 0 ? rr : (o.rrDefaut || null),
      mfe: versNombre(col(l, 'mfe')), mae: versNombre(col(l, 'mae')),
      symbole: String(col(l, 'symbole') || o.symbole || '').trim().toUpperCase(),
      qualite: String(col(l, 'qualite') || '').trim().toUpperCase(),
      tags: String(col(l, 'setup') || '').split(/[,;|]/).map(function(x){ return x.trim(); }).filter(Boolean),
      notes: String(col(l, 'notes') || ''),
      entree: entree, stop: stop, sortie: sortie
    };
    if (QUALITES.indexOf(t.qualite) < 0) t.qualite = '';
    if (r !== null && !isNaN(r)) { t.issue = 'autre'; t.r = r; }
    else if (issue === 'sl') t.issue = 'sl';
    else if (issue === 'be') t.issue = 'be';
    else if (issue === 'tp' && t.rrCible) t.issue = 'tp';
    else { res.ignores.push({ ligne: n, raison: 'résultat illisible (ni R, ni TP/SL/BE)' }); return; }
    if (!sens) t.sensDevine = true;
    if (t.mae !== null) t.mae = Math.abs(t.mae);
    res.trades.push(t);
  });
  return res;
}

// ---------- le journal reel ----------
// Le R d'un trade du journal de trading : celui ecrit a la main, sinon le profit net
// divise par le risque prevu (distance au stop x quantite x multiplicateur).
function rTradeJournal(t){
  if (!t) return null;
  if (estNombre(t.rManuel)) return t.rManuel;
  if (!estNombre(t.stopPrevu) || !estNombre(t.prixEntree) || !estNombre(t.qte) || !estNombre(t.net)) return null;
  var risque = Math.abs(t.prixEntree - t.stopPrevu) * t.qte * (t.multiplicateur || 1);
  if (!(risque > 0)) return null;
  return t.net / risque;
}
// Un trade du journal (horodatage en millisecondes) -> la forme d'un trade de backtest.
function depuisJournal(t){
  var ms = t.ouverture || t.fermeture;
  if (!ms) return null;
  var d = new Date(ms);
  var date = d.getFullYear() + '-' + deuxChiffres(d.getMonth() + 1) + '-' + deuxChiffres(d.getDate());
  var r = rTradeJournal(t);
  return {
    id: 'reel-' + t.cle, campagneId: 'reel', date: date,
    heure: deuxChiffres(d.getHours()) + ':' + deuxChiffres(d.getMinutes()),
    sens: t.sens === 'short' ? 'short' : 'long', issue: 'autre', r: r === null ? null : arrondi(r, 4),
    symbole: t.symbole || '', qualite: t.qualite || '', net: t.net, cree: ms
  };
}

var NOM_DB = 'journal-backtest', VERSION_DB = 1, DB = null;
var MAGASINS = ['campagnes', 'strategies', 'trades', 'jours', 'images', 'reglages'];

function ouvrirDB(){
  return new Promise(function(res, rej){
    var r = indexedDB.open(NOM_DB, VERSION_DB);
    r.onupgradeneeded = function(e){
      var db = e.target.result;
      if (!db.objectStoreNames.contains('campagnes'))  db.createObjectStore('campagnes', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('strategies')) db.createObjectStore('strategies', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('trades'))     db.createObjectStore('trades', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('jours'))      db.createObjectStore('jours', { keyPath: 'cle' });
      if (!db.objectStoreNames.contains('images')) {
        var si = db.createObjectStore('images', { keyPath: 'id' });
        si.createIndex('parent', 'parent');
      }
      if (!db.objectStoreNames.contains('reglages'))   db.createObjectStore('reglages', { keyPath: 'id' });
    };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
    r.onblocked = function(){ rej(new Error('base bloquée par un autre onglet')); };
  });
}
function pReq(req){
  return new Promise(function(res, rej){
    req.onsuccess = function(){ res(req.result); };
    req.onerror = function(){ rej(req.error); };
  });
}
function magasin(nom, mode){ return DB.transaction(nom, mode || 'readonly').objectStore(nom); }
function dbTous(nom){ return pReq(magasin(nom).getAll()); }
function dbLire(nom, cle){ return pReq(magasin(nom).get(cle)); }
function dbMettre(nom, val){ if (val && typeof val === 'object') val._maj = Date.now(); return pReq(magasin(nom, 'readwrite').put(val)); }
function dbSupprimer(nom, cle){ return pReq(magasin(nom, 'readwrite').delete(cle)); }
function dbVider(nom){ return pReq(magasin(nom, 'readwrite').clear()); }
function dbMettreLot(nom, liste){
  if (!liste.length) return Promise.resolve();
  return new Promise(function(res, rej){
    var t = DB.transaction(nom, 'readwrite'), s = t.objectStore(nom), m = Date.now();
    liste.forEach(function(v){ if (v && typeof v === 'object') v._maj = v._maj || m; s.put(v); });
    t.oncomplete = function(){ res(); };
    t.onerror = function(){ rej(t.error); };
  });
}
function dbSupprimerLot(nom, cles){
  if (!cles.length) return Promise.resolve();
  return new Promise(function(res, rej){
    var t = DB.transaction(nom, 'readwrite'), s = t.objectStore(nom);
    cles.forEach(function(c){ s.delete(c); });
    t.oncomplete = function(){ res(); };
    t.onerror = function(){ rej(t.error); };
  });
}
function dbParParent(parent){ return pReq(magasin('images').index('parent').getAll(parent)); }
function dbClesParParent(parent){ return pReq(magasin('images').index('parent').getAllKeys(parent)); }
