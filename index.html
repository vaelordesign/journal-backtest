function toast(msg, type){
  var pile = document.getElementById('pileMessages');
  if (!pile) {
    pile = document.createElement('div');
    pile.id = 'pileMessages';
    pile.style.cssText = 'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:300;width:max-content;max-width:92vw;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none';
    document.body.appendChild(pile);
  }
  var d = document.createElement('div');
  d.className = 'avis ' + (type || 'bleuf');
  d.style.cssText = 'box-shadow:var(--ombre);margin:0;max-width:92vw;pointer-events:auto';
  d.innerHTML = msg;
  pile.appendChild(d);
  while (pile.children.length > 3) pile.removeChild(pile.firstChild);
  setTimeout(function(){ d.style.transition = 'opacity .4s'; d.style.opacity = '0'; }, 3200);
  setTimeout(function(){ d.remove(); }, 3700);
}

/* ---------- modale ---------- */
function modale(titre, corpsHtml, piedHtml, taille){
  var v = $('#voile'), m = $('#modale');
  if (m._surFermeture) { var f = m._surFermeture; m._surFermeture = null; try { f(); } catch (e) {} }
  m._ajouterImages = null;   // voir fermerModale : on ne colle jamais sur l'ecran precedent
  m._raccourcis = null;
  m.className = 'modale' + (taille ? ' ' + taille : '');
  m.innerHTML =
    '<div class="modale-entete"><h2>' + titre + '</h2>' +
    '<button class="fantome fermer" data-fermer title="Fermer">&#10005;</button></div>' +
    '<div class="modale-corps">' + corpsHtml + '</div>' +
    (piedHtml ? '<div class="modale-pied">' + piedHtml + '</div>' : '');
  v.hidden = false;
  document.body.style.overflow = 'hidden';
  return m;
}
function fermerModale(){
  var m = $('#modale');
  if (m._surFermeture) { var f = m._surFermeture; m._surFermeture = null; try { f(); } catch (e) {} }
  $('#voile').hidden = true;
  m._ajouterImages = null;
  m._raccourcis = null;
  m.innerHTML = '';
  document.body.style.overflow = '';
}
function modaleOuverte(){ return !$('#voile').hidden; }
// La confirmation s'ouvre PAR-DESSUS la fenetre en cours, sans la remplacer :
// supprimer une capture ne doit pas faire perdre la fiche du trade ouverte derriere.
function confirmer(question, texteBouton, classe){
  return new Promise(function(res){
    var v = document.createElement('div');
    v.className = 'voile';
    v.style.zIndex = '150';
    v.innerHTML = '<div class="modale petite"><div class="modale-entete"><h2>Confirmation</h2></div>' +
      '<div class="modale-corps"><p>' + question + '</p></div>' +
      '<div class="modale-pied"><button data-non>Annuler</button><button class="' + (classe || 'dangereux') + '" data-oui>' + (texteBouton || 'Confirmer') + '</button></div></div>';
    document.body.appendChild(v);
    var fini = function(r){ v.remove(); document.removeEventListener('keydown', clavier, true); res(r); };
    var clavier = function(e){ if (e.key === 'Escape') { e.stopPropagation(); fini(false); } };
    document.addEventListener('keydown', clavier, true);
    $('[data-oui]', v).onclick = function(){ fini(true); };
    $('[data-non]', v).onclick = function(){ fini(false); };
    v.onclick = function(e){ if (e.target === v) fini(false); };
    setTimeout(function(){ $('[data-oui]', v).focus(); }, 0);
  });
}

/* ---------- infobulle : tout element qui porte data-bulle ---------- */
function bulleMontrer(evt, html){
  var b = $('#infobulle');
  b.innerHTML = html;
  b.hidden = false;
  var x = evt.clientX + 12, y = evt.clientY - 10;
  var r = b.getBoundingClientRect();
  if (x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - 12;
  if (y + r.height > window.innerHeight - 8) y = window.innerHeight - r.height - 8;
  if (x < 4) x = 4;
  if (y < 4) y = 4;
  b.style.left = x + 'px';
  b.style.top = y + 'px';
}
function bulleCacher(){ $('#infobulle').hidden = true; }

/* =======================================================================
   CAMPAGNES, STRATEGIES, FILTRE
   ======================================================================= */
function campagneDe(id){ for (var i = 0; i < E.campagnes.length; i++) if (E.campagnes[i].id === id) return E.campagnes[i]; return null; }
function strategieDe(id){ for (var i = 0; i < E.strategies.length; i++) if (E.strategies[i].id === id) return E.strategies[i]; return null; }
function strategieDeCampagne(c){ return c ? strategieDe(c.strategieId) : null; }
function confluencesDuTrade(t){
  var s = strategieDeCampagne(campagneDe(t.campagneId));
  return s ? s.confluences || [] : [];
}
function conforme(t){ return estConforme(t, confluencesDuTrade(t)); }
function seanceDuTrade(t){ return seanceDe(t.heure, E.seances); }
function ordreSeances(){ return E.seances.map(function(s){ return s.nom; }).concat(['Hors séance', 'Heure non notée']); }
function campagneActive(){ return campagneDe(E.reglages.campagneActive); }
function nomCampagne(id){ var c = campagneDe(id); return c ? c.nom : 'Campagne supprimée'; }
function tradeDe(id){ for (var i = 0; i < E.trades.length; i++) if (E.trades[i].id === id) return E.trades[i]; return null; }
function tradesDeCampagne(id){ return E.trades.filter(function(t){ return t.campagneId === id; }); }

// Les trades que regardent les ecrans d'analyse : campagne, dates du replay,
// et les deux cases (dans le plan, sans les douteux).
function tradesFiltres(){
  var f = E.filtre;
  return E.trades.filter(function(t){
    if (f.campagne && t.campagneId !== f.campagne) return false;
    if (f.debut && t.date < f.debut) return false;
    if (f.fin && t.date > f.fin) return false;
    if (f.conformes && !conforme(t)) return false;
    if (f.surs && t.douteux) return false;
    return true;
  });
}
// Jours passes en replay (cles "campagne|date"), avec ou sans trade.
function joursTestesFiltres(){
  var f = E.filtre, vus = {};
  E.jours.forEach(function(j){
    if (f.campagne && j.campagneId !== f.campagne) return;
    if (f.debut && j.date < f.debut) return;
    if (f.fin && j.date > f.fin) return;
    vus[j.campagneId + '|' + j.date] = true;
  });
  E.trades.forEach(function(t){
    if (f.campagne && t.campagneId !== f.campagne) return;
    if (f.debut && t.date < f.debut) return;
    if (f.fin && t.date > f.fin) return;
    vus[t.campagneId + '|' + t.date] = true;
  });
  return Object.keys(vus);
}
// Toutes les confluences des strategies en jeu (une campagne, ou toutes)
function confluencesEnJeu(){
  var ids = {}, liste = [];
  var camps = E.filtre.campagne ? [campagneDe(E.filtre.campagne)].filter(Boolean) : E.campagnes;
  camps.forEach(function(c){
    var s = strategieDeCampagne(c);
    if (!s) return;
    (s.confluences || []).forEach(function(x){
      if (ids[x.id]) return;
      ids[x.id] = true;
      liste.push({ id: x.id, nom: x.nom + (E.strategies.length > 1 && !E.filtre.campagne ? ' (' + s.nom + ')' : ''), obligatoire: x.obligatoire });
    });
  });
  return liste;
}
function cleJourCampagne(campagneId, date){ return campagneId + '|' + date; }
function jourDe(campagneId, date){
  var k = cleJourCampagne(campagneId, date);
  for (var i = 0; i < E.jours.length; i++) if (E.jours[i].cle === k) return E.jours[i];
  return null;
}
function tradesDuJour(campagneId, date){
  return trierChrono(E.trades.filter(function(t){ return t.campagneId === campagneId && t.date === date; }));
}

/* =======================================================================
   GRAPHIQUES (SVG a la main, aucune librairie)
   ======================================================================= */
function largeurGraphe(){ return window.innerWidth < 700 ? 560 : 1000; }

// Courbe de capital en R, un point par trade. o = { hauteur, sansDd, titre }
function svgCourbeR(courbe, o){
  o = o || {};
  if (!courbe.length) return '<div class="vide">Aucun trade à tracer.</div>';
  var L = largeurGraphe(), H = o.hauteur || 260, mg = { h: 16, b: 26, g: 52, d: 12 };
  var w = L - mg.g - mg.d, h = H - mg.h - mg.b;
  var vals = courbe.map(function(p){ return p.cumul; }).concat([0]);
  var vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
  if (vmax - vmin < 1) { vmax += 0.5; vmin -= 0.5; }
  var marge = (vmax - vmin) * 0.08; vmin -= marge; vmax += marge;
  var n = courbe.length;
  var X = function(i){ return mg.g + (n === 1 ? w / 2 : w * i / (n - 1)); };
  var Y = function(v){ return mg.h + h - h * (v - vmin) / (vmax - vmin); };
  var d = courbe.map(function(p, i){ return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.cumul).toFixed(1); }).join(' ');
  var y0 = Y(Math.max(vmin, Math.min(0, vmax)));
  var aire = 'M' + X(0).toFixed(1) + ' ' + y0.toFixed(1) + ' ' + courbe.map(function(p, i){ return 'L' + X(i).toFixed(1) + ' ' + Y(p.cumul).toFixed(1); }).join(' ') +
         ' L' + X(n - 1).toFixed(1) + ' ' + y0.toFixed(1) + ' Z';
  var dernier = courbe[n - 1].cumul;
  var couleur = dernier >= 0 ? 'var(--vert)' : 'var(--rouge)';
  var gid = 'g' + uid();
  var s = '<svg viewBox="0 0 ' + L + ' ' + H + '" style="width:100%;height:auto;display:block">';
  for (var k = 0; k <= 4; k++) {
    var v = vmin + (vmax - vmin) * k / 4, y = Y(v);
    s += '<line x1="' + mg.g + '" y1="' + y.toFixed(1) + '" x2="' + (L - mg.d) + '" y2="' + y.toFixed(1) + '" stroke="var(--bord)"/>' +
         '<text x="' + (mg.g - 8) + '" y="' + (y + 4).toFixed(1) + '" fill="var(--texte3)" font-size="11" text-anchor="end">' + fmtNombre(v, Math.abs(vmax - vmin) < 6 ? 1 : 0) + ' R</text>';
  }
  if (vmin < 0 && vmax > 0) s += '<line x1="' + mg.g + '" y1="' + Y(0).toFixed(1) + '" x2="' + (L - mg.d) + '" y2="' + Y(0).toFixed(1) + '" stroke="var(--bord2)" stroke-dasharray="4 4"/>';
  // le pire recul, en rouge pale
  if (!o.sansDd && o.dd && o.dd.debut !== null && o.dd.fin !== null && o.dd.fin > o.dd.debut) {
    var xa = X(Math.max(0, o.dd.debut)), xb = X(o.dd.fin);
    s += '<rect x="' + xa.toFixed(1) + '" y="' + mg.h + '" width="' + Math.max(2, xb - xa).toFixed(1) + '" height="' + h + '" fill="var(--rouge)" opacity=".08"/>';
  }
  s += '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + couleur + '" stop-opacity=".28"/><stop offset="100%" stop-color="' + couleur + '" stop-opacity="0"/></linearGradient></defs>';
  s += '<path d="' + aire + '" fill="url(#' + gid + ')"/>';
  s += '<path d="' + d + '" fill="none" stroke="' + couleur + '" stroke-width="2" stroke-linejoin="round"/>';
  s += '<text x="' + mg.g + '" y="' + (H - 6) + '" fill="var(--texte3)" font-size="11">' + fmtJourCourt(courbe[0].date) + '</text>';
  s += '<text x="' + (L - mg.d) + '" y="' + (H - 6) + '" fill="var(--texte3)" font-size="11" text-anchor="end">' + fmtJourCourt(courbe[n - 1].date) + ' · ' + pluriel(n, 'trade') + '</text>';
  var pas = w / Math.max(1, n);
  courbe.forEach(function(p, i){
    if (n <= 150) s += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.cumul).toFixed(1) + '" r="2.6" fill="' + (p.r > EPS ? 'var(--vert)' : (p.r < -EPS ? 'var(--rouge)' : 'var(--jaune)')) + '"/>';
    var bulle = '<b>Trade ' + (i + 1) + '</b> · ' + fmtJour(p.date) + (p.heure ? ' ' + p.heure : '') + '<br>' + fmtR(p.r) + ' &rarr; cumul <b>' + fmtR(p.cumul) + '</b>';
    s += '<rect x="' + (X(i) - pas / 2).toFixed(1) + '" y="' + mg.h + '" width="' + Math.max(pas, 1).toFixed(1) + '" height="' + h + '" fill="transparent"' +
         (p.id ? ' data-trade="' + ech(p.id) + '" style="cursor:pointer"' : '') + ' data-bulle="' + ech(bulle) + '"/>';
  });
  s += '</svg>';
  return s;
}

// Plusieurs courbes superposees : series = [{ nom, couleur, courbe }]
var COULEURS_SERIES = ['#5b8cff', '#26a69a', '#f0b90b', '#b388ff', '#ef5350', '#4ddbcc', '#ff9f43'];
function svgMultiCourbes(series, o){
  o = o || {};
  series = series.filter(function(s){ return s.courbe && s.courbe.length; });
  if (!series.length) return '<div class="vide">Rien à tracer.</div>';
  var L = largeurGraphe(), H = o.hauteur || 280, mg = { h: 16, b: 26, g: 52, d: 12 };
  var w = L - mg.g - mg.d, h = H - mg.h - mg.b;
  var nMax = Math.max.apply(null, series.map(function(s){ return s.courbe.length; }));
  var vals = [0];
  series.forEach(function(s){ s.courbe.forEach(function(p){ vals.push(p.cumul); }); });
  var vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
  if (vmax - vmin < 1) { vmax += 0.5; vmin -= 0.5; }
  var marge = (vmax - vmin) * 0.08; vmin -= marge; vmax += marge;
  var X = function(i){ return mg.g + (nMax <= 1 ? w / 2 : w * i / (nMax - 1)); };
  var Y = function(v){ return mg.h + h - h * (v - vmin) / (vmax - vmin); };
  var s = '<svg viewBox="0 0 ' + L + ' ' + H + '" style="width:100%;height:auto;display:block">';
  for (var k = 0; k <= 4; k++) {
    var v = vmin + (vmax - vmin) * k / 4, y = Y(v);
    s += '<line x1="' + mg.g + '" y1="' + y.toFixed(1) + '" x2="' + (L - mg.d) + '" y2="' + y.toFixed(1) + '" stroke="var(--bord)"/>' +
         '<text x="' + (mg.g - 8) + '" y="' + (y + 4).toFixed(1) + '" fill="var(--texte3)" font-size="11" text-anchor="end">' + fmtNombre(v, 0) + ' R</text>';
  }
  if (vmin < 0 && vmax > 0) s += '<line x1="' + mg.g + '" y1="' + Y(0).toFixed(1) + '" x2="' + (L - mg.d) + '" y2="' + Y(0).toFixed(1) + '" stroke="var(--bord2)" stroke-dasharray="4 4"/>';
  series.forEach(function(se, j){
    var c = se.couleur || COULEURS_SERIES[j % COULEURS_SERIES.length];
    var d = se.courbe.map(function(p, i){ return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.cumul).toFixed(1); }).join(' ');
    s += '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="2" stroke-linejoin="round"' + (se.pointille ? ' stroke-dasharray="5 4"' : '') + '/>';
  });
  s += '<text x="' + mg.g + '" y="' + (H - 6) + '" fill="var(--texte3)" font-size="11">trade 1</text>';
  s += '<text x="' + (L - mg.d) + '" y="' + (H - 6) + '" fill="var(--texte3)" font-size="11" text-anchor="end">trade ' + nMax + '</text>';
  s += '</svg>';
  s += '<div class="legende">' + series.map(function(se, j){
    var c = se.couleur || COULEURS_SERIES[j % COULEURS_SERIES.length];
    return '<span><i style="background:' + c + '"></i>' + ech(se.nom) + ' <b class="' + cls(se.courbe[se.courbe.length - 1].cumul) + '">' + fmtR(se.courbe[se.courbe.length - 1].cumul, 1) + '</b></span>';
  }).join('') + '</div>';
  return s;
}

// Eventail des 100 prochains trades : bandes 5-95 % et 25-75 %, mediane.
function svgEventail(ev){
  if (!ev) return '<div class="vide">Pas assez de trades.</div>';
  var L = largeurGraphe(), H = 280, mg = { h: 16, b: 26, g: 52, d: 12 };
  var w = L - mg.g - mg.d, h = H - mg.h - mg.b;
  var b = [{ k: 0, p5: 0, p25: 0, p50: 0, p75: 0, p95: 0 }].concat(ev.bandes);
  var vmin = Math.min(0, Math.min.apply(null, b.map(function(x){ return x.p5; })));
  var vmax = Math.max(0, Math.max.apply(null, b.map(function(x){ return x.p95; })));
  if (vmax - vmin < 1) { vmax += 0.5; vmin -= 0.5; }
  var marge = (vmax - vmin) * 0.06; vmin -= marge; vmax += marge;
  var X = function(k){ return mg.g + w * k / ev.nTrades; };
  var Y = function(v){ return mg.h + h - h * (v - vmin) / (vmax - vmin); };
  function bande(a, z){
    var haut = b.map(function(x){ return X(x.k).toFixed(1) + ' ' + Y(x[z]).toFixed(1); });
    var bas = b.slice().reverse().map(function(x){ return X(x.k).toFixed(1) + ' ' + Y(x[a]).toFixed(1); });
    return 'M' + haut.join(' L') + ' L' + bas.join(' L') + ' Z';
  }
  var s = '<svg viewBox="0 0 ' + L + ' ' + H + '" style="width:100%;height:auto;display:block">';
  for (var k = 0; k <= 4; k++) {
    var v = vmin + (vmax - vmin) * k / 4, y = Y(v);
    s += '<line x1="' + mg.g + '" y1="' + y.toFixed(1) + '" x2="' + (L - mg.d) + '" y2="' + y.toFixed(1) + '" stroke="var(--bord)"/>' +
         '<text x="' + (mg.g - 8) + '" y="' + (y + 4).toFixed(1) + '" fill="var(--texte3)" font-size="11" text-anchor="end">' + fmtNombre(v, 0) + ' R</text>';
  }
  s += '<line x1="' + mg.g + '" y1="' + Y(0).toFixed(1) + '" x2="' + (L - mg.d) + '" y2="' + Y(0).toFixed(1) + '" stroke="var(--bord2)" stroke-dasharray="4 4"/>';
  s += '<path d="' + bande('p5', 'p95') + '" fill="var(--accent)" opacity=".13"/>';
  s += '<path d="' + bande('p25', 'p75') + '" fill="var(--accent)" opacity=".25"/>';
  s += '<path d="M' + b.map(function(x){ return X(x.k).toFixed(1) + ' ' + Y(x.p50).toFixed(1); }).join(' L') + '" fill="none" stroke="var(--accent)" stroke-width="2.2"/>';
  s += '<text x="' + mg.g + '" y="' + (H - 6) + '" fill="var(--texte3)" font-size="11">maintenant</text>';
  s += '<text x="' + (L - mg.d) + '" y="' + (H - 6) + '" fill="var(--texte3)" font-size="11" text-anchor="end">dans ' + ev.nTrades + ' trades</text>';
  var dern = ev.bandes[ev.bandes.length - 1];
  [['p95', '5 % des cas font mieux'], ['p50', 'cas du milieu'], ['p5', '5 % des cas font pire']].forEach(function(z){
    s += '<text x="' + (L - mg.d - 4) + '" y="' + (Y(dern[z[0]]) - 5).toFixed(1) + '" fill="var(--texte2)" font-size="10" text-anchor="end">' + fmtR(dern[z[0]], 0) + ' (' + z[1] + ')</text>';
  });
  s += '</svg>';
  return s;
}

// Repartition des resultats en R, par paquets de 0,5 R (ou 1 R si l'eventail est large).
function svgDistributionR(valeurs, o){
  o = o || {};
  if (!valeurs.length) return '<div class="vide">Aucun trade.</div>';
  var min = Math.floor(Math.min.apply(null, valeurs) * 2) / 2, max = Math.ceil(Math.max.apply(null, valeurs) * 2) / 2;
  var pasR = (max - min) / 0.5 > 26 ? 1 : 0.5;
  min = Math.floor(min / pasR) * pasR; max = Math.ceil(max / pasR) * pasR;
  if (max <= min) max = min + pasR;
  var nb = Math.round((max - min) / pasR) + 1;
  var paquets = new Array(nb).fill(0);
  valeurs.forEach(function(v){ paquets[clamp(Math.round((v - min) / pasR), 0, nb - 1)]++; });
  var maxN = Math.max.apply(null, paquets);
  var L = o.largeur || largeurGraphe(), H = o.hauteur || 210, mg = { h: 14, b: 30, g: 16, d: 16 };
  var w = L - mg.g - mg.d, h = H - mg.h - mg.b;
  var pas = w / nb, larg = Math.min(46, pas * 0.78);
  var s = '<svg viewBox="0 0 ' + L + ' ' + H + '" style="width:100%;height:auto;display:block">';
  paquets.forEach(function(c, i){
    var val = min + i * pasR;
    var hh = maxN ? h * c / maxN : 0;
    var x = mg.g + pas * i + (pas - larg) / 2;
    var couleur = val > EPS ? 'var(--vert)' : (val < -EPS ? 'var(--rouge)' : 'var(--jaune)');
    s += '<rect x="' + x.toFixed(1) + '" y="' + (mg.h + h - hh).toFixed(1) + '" width="' + larg.toFixed(1) + '" height="' + Math.max(hh, c ? 1 : 0).toFixed(1) + '" rx="3" fill="' + couleur + '" opacity=".85"' +
         ' data-bulle="' + ech(pluriel(c, 'trade') + ' autour de ' + fmtR(val)) + '"/>';
    if (c) s += '<text x="' + (x + larg / 2).toFixed(1) + '" y="' + (mg.h + h - hh - 4).toFixed(1) + '" fill="var(--texte2)" font-size="10" text-anchor="middle">' + c + '</text>';
    if (nb <= 30 && (pasR === 1 || Math.abs(val - Math.round(val)) < EPS || nb <= 16)) {
      s += '<text x="' + (x + larg / 2).toFixed(1) + '" y="' + (H - 10) + '" fill="var(--texte3)" font-size="10" text-anchor="middle">' + fmtNombre(val, val % 1 ? 1 : 0) + '</text>';
    }
  });
  s += '<line x1="' + mg.g + '" y1="' + (mg.h + h) + '" x2="' + (L - mg.d) + '" y2="' + (mg.h + h) + '" stroke="var(--bord2)"/></svg>';
  return s;
}

// Barres verticales simples : items = [{ etq, val, bulle }]
function svgBarres(items, o){
  o = o || {};
  if (!items.length) return '<div class="vide">Rien à afficher.</div>';
  var L = o.largeur || largeurGraphe(), H = o.hauteur || 220, mg = { h: 14, b: 36, g: 52, d: 12 };
  var w = L - mg.g - mg.d, h = H - mg.h - mg.b;
  var vals = items.map(function(x){ return x.val; });
  var vmax = Math.max.apply(null, vals.concat([0])), vmin = Math.min.apply(null, vals.concat([0]));
  if (vmax - vmin < EPS) { vmax += 1; vmin -= 1; }
  var Y = function(v){ return mg.h + h - h * (v - vmin) / (vmax - vmin); };
  var pas = w / items.length, larg = Math.max(3, Math.min(48, pas * 0.68));
  var s = '<svg viewBox="0 0 ' + L + ' ' + H + '" style="width:100%;height:auto;display:block">';
  for (var k = 0; k <= 4; k++) {
    var v = vmin + (vmax - vmin) * k / 4, y = Y(v);
    s += '<line x1="' + mg.g + '" y1="' + y.toFixed(1) + '" x2="' + (L - mg.d) + '" y2="' + y.toFixed(1) + '" stroke="var(--bord)"/>' +
         '<text x="' + (mg.g - 8) + '" y="' + (y + 4).toFixed(1) + '" fill="var(--texte3)" font-size="11" text-anchor="end">' + (o.fmtAxe ? o.fmtAxe(v) : fmtNombre(v, 0) + ' R') + '</text>';
  }
  var y0 = Y(0);
  items.forEach(function(it, i){
    var cx = mg.g + pas * (i + 0.5);
    var y = Math.min(y0, Y(it.val)), hh = Math.max(1, Math.abs(Y(it.val) - y0));
    s += '<rect x="' + (cx - larg / 2).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + larg.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="3" fill="' +
         (it.couleur || (it.val >= 0 ? 'var(--vert)' : 'var(--rouge)')) + '" opacity=".85"' + (it.bulle ? ' data-bulle="' + ech(it.bulle) + '"' : '') + '/>';
    if (items.length <= 24) s += '<text x="' + cx.toFixed(1) + '" y="' + (H - 18) + '" fill="var(--texte3)" font-size="10" text-anchor="middle">' + ech(it.etq) + '</text>';
  });
  s += '<line x1="' + mg.g + '" y1="' + y0.toFixed(1) + '" x2="' + (L - mg.d) + '" y2="' + y0.toFixed(1) + '" stroke="var(--bord2)"/></svg>';
  return s;
}

// Barres horizontales autour de zero : lignes = [{ etq, val, extra, bulle }]
function barres(lignes, o){
  o = o || {};
  if (!lignes.length) return '<div class="vide">' + (o.vide || 'Rien à afficher.') + '</div>';
  var maxAbs = Math.max.apply(null, lignes.map(function(l){ return Math.abs(l.val); }).concat([EPS]));
  return lignes.map(function(l){
    var pct = Math.abs(l.val) / maxAbs * 50;
    var pos = l.val >= 0;
    return '<div class="barre-ligne"' + (l.bulle ? ' data-bulle="' + ech(l.bulle) + '"' : '') + '>' +
      '<div class="barre-etq" title="' + ech(l.etq) + '">' + ech(l.etq) + '</div>' +
      '<div class="barre-piste"><div style="' +
        (pos ? 'left:50%;width:' + pct.toFixed(2) + '%;background:var(--vert)' : 'right:50%;width:' + pct.toFixed(2) + '%;background:var(--rouge)') +
        (l.faible ? ';opacity:.4' : '') + '"></div>' +
        '<div style="left:50%;width:1px;background:var(--bord2);opacity:.9"></div></div>' +
      '<div class="barre-val ' + cls(l.val) + '">' + (o.fmt ? o.fmt(l.val) : fmtR(l.val)) + '</div>' +
      (l.extra !== undefined ? '<div class="barre-val gris">' + l.extra + '</div>' : '') +
      '</div>';
  }).join('');
}
// Barres de 0 a 100 % (part des trades qui atteignent un niveau)
function barresPct(lignes){
  return lignes.map(function(l){
    var p = l.part === null ? 0 : l.part * 100;
    return '<div class="barre-ligne"><div class="barre-etq">' + ech(l.etq) + '</div>' +
      '<div class="barre-piste"><div style="left:0;width:' + p.toFixed(1) + '%;background:' + (l.couleur || 'var(--accent)') + '"></div></div>' +
      '<div class="barre-val">' + (l.part === null ? '--' : fmtPct(l.part)) + '</div>' +
      (l.extra !== undefined ? '<div class="barre-val gris">' + l.extra + '</div>' : '') + '</div>';
  }).join('');
}

function chiffre(etq, val, sous, classe, bulle){
  return '<div class="chiffre"' + (bulle ? ' data-bulle="' + ech(bulle) + '"' : '') + '><div class="etq">' + etq + '</div>' +
    '<div class="val ' + (classe || '') + '">' + val + '</div>' +

}

function ligneTradeHtml(t, avecDate){
  var r = rDuTrade(t);
  var sous = [seanceDuTrade(t)];

  if (!conforme(t)) sous.push('hors plan');
  if (t.douteux) sous.push('douteux');
  return '<div class="ligne-trade" data-trade="' + ech(t.id) + '">' +
    '<span class="num petit">' + (avecDate ? fmtJourCourt(t.date).replace(/ \d{4}$/, '') : (t.heure || '--:--')) + '</span>' +
    '<span class="puce ' + (t.sens === 'short' ? 'r' : 'v') + '">' + libelleSens(t.sens) + '</span>' +
    '<span class="petit gris" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + ech(sous.join(' · ')) +
      (t.tags && t.tags.length ? ' · ' + ech(t.tags.join(', ')) : '') + (t.nbImages ? ' · &#128247; ' + t.nbImages : '') + '</span>' +
    '<span class="r ' + cls(r) + '">' + fmtR(r) + '</span>' +

function brancherLignesTrades(parent){
  $$('[data-trade]', parent).forEach(function(x){
    if (x.tagName === 'rect' || x.tagName === 'circle') return;
    x.onclick = function(){ formulaireTrade(x.dataset.trade); };
  });
}

async function ecrireJour(campagneId, date, champs){
  var j = jourDe(campagneId, date);
  if (!j) { j = { cle: cleJourCampagne(campagneId, date), campagneId: campagneId, date: date, teste: false, note: '', cree: Date.now() }; E.jours.push(j); }
  Object.assign(j, champs);
  await dbMettre('jours', j);
  return j;
}
async function changerJour(c, date){
  c.jourCourant = date;
  await dbMettre('campagnes', c);
  rendre();
}
async function terminerJour(c){
  var jour = c.jourCourant;
  var dejaTeste = (jourDe(c.id, jour) || {}).teste;
  await ecrireJour(c.id, jour, { teste: true });
  if (!dejaTeste) E.seance.nbJours++;
  var suivant = jourOuvrable(jour, 1);
  if (dateValide(c.fin) && suivant > c.fin) {
    toast('Jour noté. C\'était le dernier jour de la période de la campagne (' + fmtJourCourt(c.fin) + '). Tu peux allonger la période dans « Modifier ».', 'jaunef');
    rendre();
    return;
  }
  c.jourCourant = suivant;
  await dbMettre('campagnes', c);
  rendre();
}

var LARGEUR_MAX_IMAGE = 2200, TAILLE_MAX_IMAGE = 1.2 * 1024 * 1024;

function idSnapshotTV(url){

}
function imageSnapshotTV(id){ return 'https://s3.tradingview.com/snapshots/' + id.charAt(0).toLowerCase() + '/' + id + '.png'; }
function apercuLiensHtml(liens){
  liens = (liens || []).filter(Boolean);
  if (!liens.length) return '';
  return '<div class="galerie mt8">' + liens.map(function(u){
    var id = idSnapshotTV(u);
    return '<figure>' + (id ? '<img src="' + ech(imageSnapshotTV(id)) + '" alt="" data-grand="1" onerror="this.style.display=\'none\'">' : '') +
      '<figcaption><a href="' + ech(u) + '" target="_blank" rel="noopener">' + (id ? 'Ouvrir sur TradingView' : ech(u.slice(0, 40))) + '</a></figcaption></figure>';
  }).join('') + '</div>';
}

function choixBoutons(id, options, valeur, classe){
  return '<div class="choix-boutons ' + (classe || '') + '" id="' + id + '" data-v="' + ech(valeur || '') + '">' +
    options.map(function(o){
      return '<button type="button" data-v="' + ech(o[0]) + '"' + (o[0] === valeur ? ' class="on"' : '') + (o[2] ? ' title="' + ech(o[2]) + '"' : '') + '>' + o[1] + '</button>';
    }).join('') + '</div>';
}
function brancherChoix(boite, surChange, permetVide){
  $$('button', boite).forEach(function(b){
    b.onclick = function(){
      var v = b.dataset.v;
      if (permetVide && boite.dataset.v === v) v = '';
      boite.dataset.v = v;
      $$('button', boite).forEach(function(x){ x.classList.toggle('on', x.dataset.v === v); });
      if (surChange) surChange(v);
    };
  });
}

function valeurNum(id, m){
  var el = $('#' + id, m);
  if (!el) return null;
  var v = versNombre(el.value);
  return v === null ? null : v;
}

async function formulaireTrade(id, defauts){

    '</div>' +
    '<div class="bloc-saisie"><h4>Étiquettes</h4><div class="etiquettes" id="ftTags">' + etiquettes.map(function(x){

    }).join('') + '</div>' +
      '<div class="ligne mt8"><input id="ftNouvTag" placeholder="Nouvelle étiquette" style="max-width:240px"><button class="pt" id="ftAjoutTag">Ajouter</button></div></div>' +
    '<label class="champ"><span>Notes</span><textarea id="ftNotes" rows="3" placeholder="Pourquoi ce trade, ce que tu as vu, ce qui s\'est passé après...">' + ech(t.notes || '') + '</textarea></label>' +
    '<label class="champ"><span>Lien de la capture TradingView (facultatif)</span><input id="ftLien" placeholder="https://www.tradingview.com/x/..." value="' + ech((t.liens || []).join(' ')) + '">' +
      '<small>Dans TradingView : l\'appareil photo en haut à droite, « Copier le lien de l\'image ». Ou mieux : « Copier l\'image » puis <b>Ctrl+V</b> ici, l\'image est gardée dans l\'app.</small></label>' +
    '<div id="ftLienApercu">' + apercuLiensHtml(t.liens) + '</div>' +

  var titre = existant ? 'Trade du ' + fmtJour(t.date) + (t.heure ? ' à ' + heureNormale(t.heure) : '') : 'Nouveau trade';

  m._surFermeture = function(){

  var boiteSens = $('#ftSens', m), boiteIssue = $('#ftIssue', m), boiteBiais = $('#ftBiais', m), boiteQual = $('#ftQualite', m);

    return { r: r, f: f, coches: coches };

/* ---------- photos (meme bloc que le journal de trading) ---------- */
async function preparerImage(f){
  var bmp = null;
  try { bmp = await createImageBitmap(f); } catch (e) { bmp = null; }
  if (!bmp) return { illisible: true };
  var nom = f.name || ('capture ' + new Date().toLocaleString('fr-CA'));
  var l = bmp.width, h = bmp.height;
  if (l <= LARGEUR_MAX_IMAGE && f.size <= TAILLE_MAX_IMAGE) { bmp.close(); return { blob: f, nom: nom, largeur: l, hauteur: h }; }
  var r = Math.min(1, LARGEUR_MAX_IMAGE / l);
  var nl = Math.max(1, Math.round(l * r)), nh = Math.max(1, Math.round(h * r));
  var c = document.createElement('canvas');
  c.width = nl; c.height = nh;
  c.getContext('2d').drawImage(bmp, 0, 0, nl, nh);
  bmp.close();
  var reduit = await new Promise(function(res){ c.toBlob(res, 'image/webp', 0.92); });
  if (!reduit) reduit = await new Promise(function(res){ c.toBlob(res, 'image/jpeg', 0.9); });
  if (!reduit || reduit.size >= f.size) return { blob: f, nom: nom, largeur: l, hauteur: h };
  return { blob: reduit, nom: nom, largeur: nl, hauteur: nh, gagne: f.size - reduit.size };
}
function fmtOctets(o){
  if (!isFinite(o)) return '--';
  if (o < 1024) return o + ' o';
  if (o < 1024 * 1024) return Math.round(o / 1024) + ' Ko';
  return fmtNombre(o / 1024 / 1024, 1) + ' Mo';
}
async function installerPhotos(parent, hote, o){
  o = o || {};
  var n = uid();
  var idg = 'phg' + n, idz = 'phz' + n, idb = 'phb' + n, idf = 'phf' + n;
  var urlsLocales = [];
  hote.innerHTML =
    '<div class="galerie" id="' + idg + '"></div>' +
    '<div class="zone-coller" id="' + idz + '">' +
      '<button class="primaire" id="' + idb + '" type="button">&#128247;&nbsp; Ajouter des captures</button>' +
      '<div class="petit gris" style="margin-top:8px">Ou <b>Ctrl+V</b> pour coller une capture, ou glisse l\'image ici.</div>' +
      '<input type="file" id="' + idf + '" accept="image/*" multiple hidden>' +
    '</div>';
  var g = $('#' + idg), z = $('#' + idz), b = $('#' + idb), f = $('#' + idf);
  function libererLocales(){ urlsLocales.forEach(function(u){ try { URL.revokeObjectURL(u); } catch (e) {} }); urlsLocales = []; }
  async function maj(){
    var imgs = await dbParParent(parent);
    imgs.sort(function(a, c){ return a.date - c.date; });
    libererLocales();
    g.innerHTML = imgs.length ? imgs.map(function(im){
      var u = URL.createObjectURL(im.blob);
      urlsLocales.push(u);
      return '<figure><img src="' + u + '" data-voir="1" alt="">' +
        '<button class="sup" type="button" data-sup="' + ech(im.id) + '" title="supprimer">&#10005;</button>' +
        '<figcaption>' + ech(im.nom || '') + '</figcaption></figure>';
    }).join('') : '<div class="petit gris" style="grid-column:1/-1">' + (o.vide || 'Aucune capture.') + '</div>';
    $$('[data-sup]', g).forEach(function(bt){
      bt.onclick = async function(e){
        e.stopPropagation();
        if (!await confirmer('Supprimer cette capture ?', 'Supprimer')) return;
        await dbSupprimer('images', bt.dataset.sup);
        await maj();
      };
    });
    $$('[data-voir]', g).forEach(function(i){ i.onclick = function(){ grandeImage(i.src); }; });
    return imgs.length;
  }
  async function ajouter(fichiers){
    var nb = 0, gagne = 0, refuses = [];
    b.disabled = true; b.textContent = 'Ajout en cours...';
    for (var i = 0; i < fichiers.length; i++) {
      var fi = fichiers[i];
      if (!fi) continue;
      if (fi.type && fi.type.indexOf('image/') !== 0) { refuses.push((fi.name || 'fichier') + ' n\'est pas une image'); continue; }
      var prep = await preparerImage(fi);
      if (prep.illisible) { refuses.push((fi.name || 'image') + ' : format illisible par le navigateur (HEIC ?), convertis-la en JPEG ou PNG'); continue; }
      await dbMettre('images', { id: uid(), parent: parent, blob: prep.blob, nom: prep.nom, type: prep.blob.type, date: Date.now(),
                                 largeur: prep.largeur || null, hauteur: prep.hauteur || null });
      if (prep.gagne) gagne += prep.gagne;
      nb++;
    }
    b.disabled = false; b.innerHTML = '&#128247;&nbsp; Ajouter des captures';
    if (nb) {
      await maj();
      toast(pluriel(nb, 'capture ajoutée', 'captures ajoutées') + (gagne > 1024 ? ' <span class="gris">(allégées de ' + fmtOctets(gagne) + ')</span>' : ''), 'vertf');
    }
    if (refuses.length) toast(refuses.join('<br>'), 'rougef');
    return nb;
  }
  b.onclick = function(){ f.click(); };
  f.onchange = function(e){ ajouter(e.target.files); e.target.value = ''; };
  ['dragenter', 'dragover'].forEach(function(ev){ z.addEventListener(ev, function(e){ e.preventDefault(); z.classList.add('survol'); }); });
  ['dragleave', 'drop'].forEach(function(ev){ z.addEventListener(ev, function(e){ e.preventDefault(); z.classList.remove('survol'); }); });
  z.addEventListener('drop', function(e){ ajouter(e.dataTransfer.files); });
  await maj();
  return { maj: maj, ajouter: ajouter };
}
function grandeImage(src){
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:12px;cursor:zoom-out';

  d.onclick = function(){ d.remove(); };
  d.className = 'grande-image';
  document.body.appendChild(d);
}

}

function videAnalyse(){
  if (!E.trades.length) return '<div class="vide">Aucun trade pour l\'instant. Commence une <a href="#seance" data-aller="seance">séance de replay</a>, ou <a href="#import" data-aller="import">importe</a> un fichier.</div>';
  return '<div class="vide">Aucun trade ne correspond au bandeau du haut (campagne, dates, cases cochées).</div>';
}
function libelleSqn(q){
  if (q === null) return '--';
  if (q < 1.6) return 'faible';
  if (q < 2) return 'moyen';
  if (q < 2.5) return 'bon';
  if (q < 3) return 'excellent';
  return 'superbe (vérifie l\'échantillon)';
}
function verdictEchantillon(st, ic, besoin){
  if (st.nb < 2 || !ic) return { classe: 'jaunef', txt: 'Il faut au moins 2 trades avec un R pour parler de fiabilité.' };
  if (st.nb < 30) return { classe: 'jaunef', txt: '<b>Trop tôt pour conclure.</b> Avec ' + st.nb + ' trades, presque n\'importe quel résultat peut venir de la chance. Continue jusqu\'à 30 au minimum, 100 idéalement.' };
  if (ic.bas > 0) return { classe: 'vertf', txt: '<b>Ta stratégie est positive, et ce n\'est probablement pas de la chance :</b> même le bas de la fourchette (' + fmtR(ic.bas) + ' par trade) est au-dessus de zéro.' };
  if (ic.haut < 0) return { classe: 'rougef', txt: '<b>Ta stratégie perd de l\'argent :</b> même le haut de la fourchette (' + fmtR(ic.haut) + ' par trade) est sous zéro. Une règle à changer, pas des trades à rajouter.' };
  return { classe: 'jaunef', txt: '<b>Pas encore prouvé.</b> La vraie espérance se situe probablement entre ' + fmtR(ic.bas) + ' et ' + fmtR(ic.haut) + ' par trade : la fourchette contient zéro.' +
    (besoin ? ' Si les résultats restent ceux d\'aujourd\'hui, il faudrait environ <b>' + fmtNombre(besoin, 0) + ' trades</b> pour en être sûr.' : '') };
}

function rendreCalendrier(){
  var el = $('#ec-calendrier');
  var tr = tradesFiltres();
  var parDate = {};
  tr.forEach(function(t){
    var d = parDate[t.date] = parDate[t.date] || { r: 0, nb: 0, teste: true, avecR: 0 };
    var r = rDuTrade(t);
    d.nb++; if (r !== null) { d.r += r; d.avecR++; }
  });
  joursTestesFiltres().forEach(function(k){
    var date = k.split('|')[1];
    parDate[date] = parDate[date] || { r: 0, nb: 0, teste: true, avecR: 0 };
  });
  var dates = Object.keys(parDate).sort();
  var camp = E.filtre.campagne ? campagneDe(E.filtre.campagne) : null;
  if (!E.cal) {
    var ref = dates.length ? dates[dates.length - 1] : (camp && camp.jourCourant) || (campagneActive() && campagneActive().jourCourant) || aujourdhui();
    E.cal = { an: +ref.slice(0, 4), mois: +ref.slice(5, 7) - 1 };
  }
  var an = E.cal.an, mois = E.cal.mois;
  var cleMois = an + '-' + deuxChiffres(mois + 1);
  var premier = cleMois + '-01';
  var nbJ = new Date(Date.UTC(an, mois + 1, 0)).getUTCDate();
  var decal = (jourSemaine(premier) + 6) % 7;   // lundi en premier
  var tm = tr.filter(function(t){ return t.date.slice(0, 7) === cleMois; });
  var sm = statsR(tm);
  var joursMois = dates.filter(function(d){ return d.slice(0, 7) === cleMois; });
  var avecSetup = joursMois.filter(function(d){ return parDate[d].nb > 0; }).length;

  var cases = '';
  ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].forEach(function(n){ cases += '<div class="cal-jour-nom">' + n + '</div>'; });
  for (var i = 0; i < decal; i++) cases += '<div class="cal-case hors"></div>';
  for (var j = 1; j <= nbJ; j++) {
    var cle = cleMois + '-' + deuxChiffres(j);
    var d = parDate[cle];
    var classes = ['cal-case'];
    if (estWeekend(cle)) classes.push('weekend');
    if (camp && cle >= camp.debut && cle <= camp.fin) classes.push('periode');
    var contenu = '<span class="jnum">' + j + '</span>';
    if (d && d.nb) {
      classes.push(d.r > EPS ? 'g' : (d.r < -EPS ? 'p' : 'n'));
      contenu += '<span class="jval ' + cls(d.r) + '">' + fmtR(d.r, 1) + '</span><span class="jnb">' + pluriel(d.nb, 'trade') + '</span>';
    } else if (d) {
      classes.push('vide-teste');
      contenu += '<span class="jnb">aucun setup</span>';
    }
    cases += '<div class="' + classes.join(' ') + '" data-jour="' + cle + '">' + contenu + '</div>';
  }
  // les mois qui ont de l'activite, pour sauter vite
  var moisActifs = {};
  dates.forEach(function(d){ moisActifs[d.slice(0, 7)] = true; });
  var listeMois = Object.keys(moisActifs).sort();

  el.innerHTML =
    '<div class="carte">' +
      '<div class="cal-entete">' +
        '<button id="calAvant">&#9664;</button>' +
        '<h2 class="mb0" style="min-width:170px;text-align:center">' + nomMois(cleMois) + '</h2>' +
        '<button id="calApres">&#9654;</button>' +
        '<span class="petit gris">' + pluriel(joursMois.length, 'jour testé', 'jours testés') + ' · ' + avecSetup + ' avec setup · ' + pluriel(sm.nb, 'trade') + ' · ' +
          '<b class="' + cls(sm.total) + '">' + fmtR(sm.total) + '</b>' + (sm.nb ? ' · réussite ' + fmtPct(sm.tauxReussite) : '') + '</span>' +
      '</div>' +
      '<div class="cal-grille">' + cases + '</div>' +
      '<div class="legende mt8"><span>Les dates sont celles du <b>replay</b>, pas le jour où tu as fait le backtest.</span>' +
        '<span>Hachuré = testé sans setup</span>' + (camp ? '<span><i style="background:var(--accent)"></i>dans la période de la campagne</span>' : '') + '</div>' +
    '</div>' +
    (listeMois.length ? '<div class="carte"><h3>Tous les mois testés</h3><div class="etiquettes">' + listeMois.map(function(k){
      var s = statsR(tr.filter(function(t){ return t.date.slice(0, 7) === k; }));
      return '<button class="pt" data-mois="' + k + '"' + (k === cleMois ? ' style="border-color:var(--accent)"' : '') + '>' + nomMois(k) + ' <b class="' + cls(s.total) + '">' + fmtR(s.total, 1) + '</b></button>';
    }).join('') + '</div></div>' : '');

  $('#calAvant').onclick = function(){ E.cal.mois--; if (E.cal.mois < 0) { E.cal.mois = 11; E.cal.an--; } rendre(); };
  $('#calApres').onclick = function(){ E.cal.mois++; if (E.cal.mois > 11) { E.cal.mois = 0; E.cal.an++; } rendre(); };
  $$('[data-mois]', el).forEach(function(b){ b.onclick = function(){ E.cal = { an: +b.dataset.mois.slice(0, 4), mois: +b.dataset.mois.slice(5, 7) - 1 }; rendre(); }; });
  $$('.cal-case[data-jour]', el).forEach(function(c){ c.onclick = function(){ ouvrirJour(c.dataset.jour); }; });
}
function ouvrirJour(date){
  var tr = tradesFiltres().filter(function(t){ return t.date === date; });
  tr = trierChrono(tr);
  var s = statsR(tr);
  var camps = E.filtre.campagne ? [E.filtre.campagne] : E.campagnes.map(function(c){ return c.id; });
  var notes = camps.map(function(id){ var j = jourDe(id, date); return j && j.note ? '<div class="avis petit"><b>' + ech(nomCampagne(id)) + ' :</b> ' + ech(j.note) + '</div>' : ''; }).join('');
  var campCible = E.filtre.campagne || E.reglages.campagneActive;
  var m = modale(fmtJourLong(date),
    notes +
    (tr.length ? tr.map(function(t){ return ligneTradeHtml(t) + (E.filtre.campagne ? '' : '<div class="mini gris" style="margin:-4px 0 6px 10px">' + ech(nomCampagne(t.campagneId)) + '</div>'); }).join('') +
      '<div class="petit droite">Total : <b class="' + cls(s.total) + '">' + fmtR(s.total) + '</b></div>'
      : '<div class="petit gris">Aucun trade ce jour-là.</div>'),
    (E.rapport ? '' : '<button id="ojSeance">Ouvrir ce jour dans la séance</button>' + (campCible ? '<button class="primaire" id="ojNouveau">+ Trade ce jour</button>' : '')) + '<button data-fermer>Fermer</button>', 'petite');
  brancherLignesTrades(m);
  if ($('#ojSeance', m)) $('#ojSeance', m).onclick = async function(){
    var c = campagneDe(campCible);
    if (!c) return;
    c.jourCourant = date;
    await dbMettre('campagnes', c);
    E.reglages.campagneActive = c.id;
    await sauverReglages();
    fermerModale();
    allerA('seance');
  };
  if ($('#ojNouveau', m)) $('#ojNouveau', m).onclick = function(){ fermerModale(); formulaireTrade(null, { campagneId: campCible, date: date }); };
}

var LISTE = { texte: '', sens: '', resultat: '', qualite: '' };
function tradesListe(){
  var tr = tradesFiltres();
  var q = normaliserTexte(LISTE.texte);
  return tr.filter(function(t){
    if (LISTE.sens && t.sens !== LISTE.sens) return false;
    var r = rDuTrade(t);
    if (LISTE.resultat === 'g' && !(r > EPS)) return false;
    if (LISTE.resultat === 'p' && !(r < -EPS)) return false;
    if (LISTE.resultat === 'be' && !(r !== null && Math.abs(r) < EPS)) return false;
    if (LISTE.resultat === 'sansmfe' && estNombre(t.mfe)) return false;
    if (LISTE.qualite && t.qualite !== LISTE.qualite) return false;
    if (q && normaliserTexte([t.notes, (t.tags || []).join(' '), t.symbole, seanceDuTrade(t)].join(' ')).indexOf(q) < 0) return false;
    return true;
  });
}

          '<td class="petit">' + (t.nbImages ? '&#128247; ' + t.nbImages : '') + ((t.liens || []).length ? ' &#128279;' : '') + (t.notes ? ' &#128221;' : '') + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>' : videAnalyse());
  $('#liSens').value = LISTE.sens; $('#liRes').value = LISTE.resultat; $('#liQual').value = LISTE.qualite;
  var minut = null;
  $('#liTexte').oninput = function(){ var v = this.value; clearTimeout(minut); minut = setTimeout(function(){ LISTE.texte = v; rendre(); var i = $('#liTexte'); i.focus(); i.setSelectionRange(v.length, v.length); }, 250); };
  $('#liSens').onchange = function(){ LISTE.sens = this.value; rendre(); };

  $$('[data-tri]', el).forEach(function(h){ h.onclick = function(){ var c = h.dataset.tri; if (E.tri.col === c) E.tri.sens = -E.tri.sens; else { E.tri.col = c; E.tri.sens = c === 'chrono' ? -1 : -1; } rendre(); }; });
  brancherLignesTrades(el);
}

var MIN_FIABLE = 10;
function tableGroupes(groupes, nomCol, o){
  o = o || {};
  if (!groupes.length) return '<div class="petit gris">Rien à afficher.</div>';
  var tot = o.total;
  return '<div class="tableau-boite"><table class="auto"><thead><tr><th>' + nomCol + '</th><th class="num">Trades</th><th class="num">Réussite</th>' +
    '<th class="num">Espérance</th><th class="num">Total</th><th class="num">Fact. profit</th></tr></thead><tbody>' +
    groupes.map(function(g){
      var s = g.stats;
      return '<tr class="' + (s.nb < MIN_FIABLE ? 'faible' : '') + '"><td class="etq-faible">' + ech(g.cle) + '</td>' +
        '<td class="num">' + s.nb + '</td><td class="num">' + fmtPct(s.tauxReussite) + '</td>' +
        '<td class="num gras ' + cls(s.moyenne) + '">' + fmtR(s.moyenne) + '</td>' +
        '<td class="num ' + cls(s.total) + '">' + fmtR(s.total, 1) + '</td>' +
        '<td class="num">' + (s.facteurProfit === null ? '--' : fmtFacteur(s.facteurProfit)) + '</td></tr>';
    }).join('') +
    (tot ? '<tr class="total"><td>Tous</td><td class="num">' + tot.nb + '</td><td class="num">' + fmtPct(tot.tauxReussite) + '</td><td class="num ' + cls(tot.moyenne) + '">' + fmtR(tot.moyenne) + '</td>' +
      '<td class="num ' + cls(tot.total) + '">' + fmtR(tot.total, 1) + '</td><td class="num">' + (tot.facteurProfit === null ? '--' : fmtFacteur(tot.facteurProfit)) + '</td></tr>' : '') +
    '</tbody></table></div>';
}
// Une phrase qui dit ce qui ressort vraiment, en ignorant les petits groupes.
function constat(groupes, tot, nom){
  var fiables = groupes.filter(function(g){ return g.stats.nb >= MIN_FIABLE && g.stats.moyenne !== null; });
  if (fiables.length < 2 || !tot || tot.moyenne === null) return '';
  fiables.sort(function(a, b){ return b.stats.moyenne - a.stats.moyenne; });
  var h = fiables[0], b = fiables[fiables.length - 1];
  if (h.stats.moyenne - b.stats.moyenne < 0.25) return '<div class="aide">Pas de grand écart entre les ' + nom + ' qui ont au moins ' + MIN_FIABLE + ' trades.</div>';
  return '<div class="aide">Le meilleur : <b class="vert">' + ech(h.cle) + '</b> (' + fmtR(h.stats.moyenne) + ' sur ' + h.stats.nb + ' trades). ' +
    'Le pire : <b class="' + cls(b.stats.moyenne) + '">' + ech(b.cle) + '</b> (' + fmtR(b.stats.moyenne) + ' sur ' + b.stats.nb + '). À vérifier dans le Laboratoire avant d\'en faire une règle.</div>';
}

  };
  g.mois.forEach(function(x){ x.cle = nomMois(x.cle); });

  var lignesConf = ac.map(function(a){
    var faible = a.avec.nb < MIN_FIABLE || a.sans.nb < MIN_FIABLE;
    return '<tr class="' + (faible ? 'faible' : '') + '"><td class="etq-faible">' + ech(a.nom) + (a.obligatoire ? ' <span class="jaune">&#9733;</span>' : '') + '</td>' +
      '<td class="num">' + a.avec.nb + '</td><td class="num ' + cls(a.avec.moyenne) + '">' + fmtR(a.avec.moyenne) + '</td><td class="num">' + fmtPct(a.avec.tauxReussite) + '</td>' +
      '<td class="num">' + a.sans.nb + '</td><td class="num ' + cls(a.sans.moyenne) + '">' + fmtR(a.sans.moyenne) + '</td><td class="num">' + fmtPct(a.sans.tauxReussite) + '</td>' +
      '<td class="num gras ' + cls(a.ecart) + '">' + (a.ecart === null ? '--' : (a.ecart > 0 ? '+' : '') + fmtNombre(a.ecart, 2) + ' R') + '</td></tr>';
  }).join('');
  var utiles = ac.filter(function(a){ return a.avec.nb >= MIN_FIABLE && a.sans.nb >= MIN_FIABLE && a.ecart !== null; }).sort(function(a, b){ return b.ecart - a.ecart; });
  var phraseConf = utiles.length ? '<div class="aide">Ce qui pèse le plus : <b class="' + cls(utiles[0].ecart) + '">' + ech(utiles[0].nom) + '</b> (' + (utiles[0].ecart > 0 ? '+' : '') + fmtNombre(utiles[0].ecart, 2) + ' R par trade quand elle est là)' +
    (utiles.length > 1 && utiles[utiles.length - 1].ecart < 0 ? '. Celle qui semble nuire : <b class="rouge">' + ech(utiles[utiles.length - 1].nom) + '</b> (' + fmtNombre(utiles[utiles.length - 1].ecart, 2) + ' R)' : '') + '.</div>'
    : '<div class="aide">Il faut au moins ' + MIN_FIABLE + ' trades avec ET sans une étape pour la juger.</div>';

  function carte(titre, groupes, nomCol, sousTitre, nom){
    return '<div class="carte"><h3>' + titre + '</h3>' + (sousTitre ? '<p class="petit gris">' + sousTitre + '</p>' : '') +

  }
  el.innerHTML =
    '<div class="avis bleuf petit">Tout est en R. Une ligne grise = moins de ' + MIN_FIABLE + ' trades : ne t\'y fie pas encore. Une différence repérée ici est une <b>piste</b> ; elle devient une règle seulement si elle tient dans le Laboratoire (les deux moitiés) puis sur une nouvelle période.</div>' +
    '<div class="carte"><h3>Les étapes et confluences de ta stratégie</h3>' +
      '<p class="petit gris">Pour chaque étape : les trades où tu l\'as cochée contre ceux où elle manquait. L\'écart dit ce qu\'elle vaut vraiment.</p>' +
      (cf.length ? '<div class="tableau-boite"><table><thead><tr><th>Étape</th><th class="num">Avec</th><th class="num">Espérance</th><th class="num">Réussite</th>' +
        '<th class="num">Sans</th><th class="num">Espérance</th><th class="num">Réussite</th><th class="num">Écart</th></tr></thead><tbody>' + lignesConf + '</tbody></table></div>' + phraseConf
        : '<div class="petit gris">Aucune étape définie dans la stratégie.</div>') +
    '</div>' +
    '<div class="deux-col">' +
      carte('Dans le plan ou hors plan', g.plan, 'Trades', 'Hors plan = au moins une étape obligatoire manquait. Si les deux se valent, une de tes étapes « obligatoires » ne sert peut-être à rien.') +
      carte('Nombre d\'étapes cochées', g.nbConf, 'Étapes', 'Plus de confluences donne-t-il de meilleurs trades ?') +
      carte('Séance', g.seance, 'Séance', 'Heures de New York, réglables dans Réglages.', 'séances') +
      carte('Jour de la semaine', g.jour, 'Jour', '', 'jours') +
      carte('Sens', g.sens, 'Sens') +
      carte('Biais du jour', g.biais, 'Relation au biais', 'Le trade va-t-il dans le sens du biais que tu avais noté ?') +
      carte('Qualité du setup', g.qualite, 'Qualité', 'Si les A+ ne font pas mieux que les B, ta façon de noter la qualité est à revoir.') +
      carte('R:R visé', g.rr, 'Cible') +
      carte('Taille du stop', g.stop, 'Stop', 'Seulement pour les trades avec les prix d\'entrée et de stop.') +
      carte('Durée du trade', g.duree, 'Durée') +

      carte('Mois du replay', g.mois, 'Mois', 'Une stratégie solide gagne dans la plupart des mois, pas grâce à un seul.', 'mois') +
      (g.symbole.length > 1 ? carte('Symbole', g.symbole, 'Symbole') : '') +
    '</div>' +
    '<div class="carte"><h3>Heure d\'entrée (par demi-heure)</h3>' + tableGroupes(g.heure, 'Heure', { total: tot }) + constat(g.heure, tot, 'demi-heures') + '</div>' +
    '<div class="carte"><h3>Étiquettes</h3><p class="petit gris">Un trade peut avoir plusieurs étiquettes : il compte alors dans chacune.</p>' + tableGroupes(g.tags, 'Étiquette', { total: tot }) + constat(g.tags, tot, 'étiquettes') + '</div>';
}

/* =======================================================================
   ECRAN 6 : LABORATOIRE (et si je ne prenais que...)
   Un filtre sur tes trades, compare a l'ensemble, puis le test qui compte :
   le filtre tient-il dans les DEUX moities de la periode ? Sinon c'est du hasard.
   ======================================================================= */
function laboDefaut(){
  return { seances: [], jours: [], sens: '', qualiteMin: '', confl: [], biais: '', tags: [], heureDe: '', heureA: '', exclureDouteux: false, seulementPlan: false };
}
function passeFiltreLabo(t, f){
  if (f.seances.length && f.seances.indexOf(seanceDuTrade(t)) < 0) return false;
  if (f.jours.length && f.jours.indexOf(jourSemaine(t.date)) < 0) return false;
  if (f.sens && t.sens !== f.sens) return false;
  if (f.qualiteMin && QUALITES.indexOf(t.qualite) < QUALITES.indexOf(f.qualiteMin)) return false;
  if (f.confl.length && !f.confl.every(function(id){ return !!(t.confl || {})[id]; })) return false;
  if (f.biais === 'avec' && relationBiais(t) !== 'Dans le sens du biais') return false;
  if (f.biais === 'pascontre' && relationBiais(t) === 'Contre le biais') return false;
  if (f.tags.length && !f.tags.some(function(x){ return (t.tags || []).indexOf(x) >= 0; })) return false;
  var m = minutesDe(t.heure);
  if (f.heureDe && (m === null || m < minutesDe(f.heureDe))) return false;
  if (f.heureA && (m === null || m >= minutesDe(f.heureA))) return false;
  if (f.exclureDouteux && t.douteux) return false;
  if (f.seulementPlan && !conforme(t)) return false;
  return true;
}
function decrireFiltreLabo(f, cf){
  var p = [];
  if (f.seances.length) p.push('séance ' + f.seances.join(' ou '));
  if (f.jours.length) p.push(f.jours.map(function(j){ return JOURS_FR[j].toLowerCase(); }).join(', '));
  if (f.sens) p.push('seulement ' + f.sens);
  if (f.qualiteMin) p.push('qualité ' + f.qualiteMin + ' ou mieux');
  if (f.confl.length) p.push('avec ' + f.confl.map(function(id){ var c = cf.filter(function(x){ return x.id === id; })[0]; return c ? c.nom : id; }).join(' + '));
  if (f.biais === 'avec') p.push('dans le sens du biais');
  if (f.biais === 'pascontre') p.push('jamais contre le biais');
  if (f.tags.length) p.push('étiquette ' + f.tags.join(' ou '));
  if (f.heureDe || f.heureA) p.push('entre ' + (f.heureDe || '00:00') + ' et ' + (f.heureA || '24:00'));
  if (f.exclureDouteux) p.push('sans les douteux');
  if (f.seulementPlan) p.push('dans le plan');
  return p;
}
function chipsLabo(id, options, choisis){
  return '<div class="etiquettes" data-groupe="' + id + '">' + options.map(function(o){
    var on = choisis.indexOf(o[0]) >= 0;
    return '<label class="etq-choix' + (on ? ' on' : '') + '"><input type="checkbox" value="' + ech(o[0]) + '"' + (on ? ' checked' : '') + '>' + ech(o[1]) + '</label>';
  }).join('') + '</div>';
}
function ligneComparaison(nom, tr, jours, classe){
  var s = statsR(tr), fr = frequence(tr, jours), ic = intervalle95(s.valeurs);
  return '<tr class="' + (classe || '') + '"><td class="gras">' + nom + '</td><td class="num">' + s.nb + '</td><td class="num">' + fmtNombre(fr.parSemaine, 1) + '</td>' +
    '<td class="num">' + fmtPct(s.tauxReussite) + '</td><td class="num gras ' + cls(s.moyenne) + '">' + fmtR(s.moyenne) + '</td>' +
    '<td class="num ' + cls(s.total) + '">' + fmtR(s.total, 1) + '</td><td class="num">' + (s.facteurProfit === null ? '--' : fmtFacteur(s.facteurProfit)) + '</td>' +
    '<td class="num rouge">' + (s.ddMax ? '-' + fmtNombre(s.ddMax, 1) + ' R' : '0') + '</td>' +
    '<td class="num petit">' + (ic ? fmtR(ic.bas) + ' à ' + fmtR(ic.haut) : '--') + '</td></tr>';
}

function rendreLabo(){
  var el = $('#ec-labo');
  var tr = tradesFiltres();
  if (!tr.length) { el.innerHTML = videAnalyse(); return; }
  if (!E.labo) E.labo = laboDefaut();
  var f = E.labo, cf = confluencesEnJeu();
  var jours = joursTestesFiltres();
  var gardes = tr.filter(function(t){ return passeFiltreLabo(t, f); });
  var ecartes = tr.filter(function(t){ return !passeFiltreLabo(t, f); });
  var desc = decrireFiltreLabo(f, cf);
  var sT = statsR(tr), sG = statsR(gardes);

  // robustesse : deux moities de la periode, coupees a la date du trade du milieu
  var chrono = trierChrono(tr);
  var dateMilieu = chrono.length ? chrono[Math.floor(chrono.length / 2)].date : null;
  var moitie1 = tr.filter(function(t){ return t.date < dateMilieu; }), moitie2 = tr.filter(function(t){ return t.date >= dateMilieu; });
  if (!moitie1.length) { moitie1 = chrono.slice(0, Math.floor(chrono.length / 2)); moitie2 = chrono.slice(Math.floor(chrono.length / 2)); }
  function bilanMoitie(liste){
    var g = liste.filter(function(t){ return passeFiltreLabo(t, f); });
    return { tous: statsR(liste), gardes: statsR(g) };
  }
  var b1 = bilanMoitie(moitie1), b2 = bilanMoitie(moitie2);
  var verdict = '';
  if (!desc.length) verdict = '<div class="avis bleuf">Choisis un ou plusieurs critères ci-dessus : l\'app compare tout de suite les trades gardés à l\'ensemble.</div>';
  else if (sG.nb < 10) verdict = '<div class="avis jaunef"><b>Trop peu de trades gardés (' + sG.nb + ').</b> Avec si peu, n\'importe quel filtre a l\'air génial ou nul. Élargis le filtre ou continue le backtest.</div>';
  else {
    var mieux1 = b1.gardes.nb >= 5 && b1.gardes.moyenne !== null && b1.tous.moyenne !== null && b1.gardes.moyenne > b1.tous.moyenne + 0.05;
    var mieux2 = b2.gardes.nb >= 5 && b2.gardes.moyenne !== null && b2.tous.moyenne !== null && b2.gardes.moyenne > b2.tous.moyenne + 0.05;
    if (sG.moyenne <= sT.moyenne + 0.05) verdict = '<div class="avis jaunef"><b>Ce filtre n\'améliore pas l\'espérance</b> (' + fmtR(sG.moyenne) + ' contre ' + fmtR(sT.moyenne) + ' pour tous les trades).</div>';
    else if (mieux1 && mieux2) verdict = '<div class="avis vertf"><b>Le filtre tient dans les deux moitiés de la période : c\'est une piste sérieuse.</b> Dernière étape avant d\'en faire une règle : le tester sur une période que tu n\'as jamais rejouée.' +
      (E.rapport ? '' : ' <button class="pt primaire" id="laNouvelle">Tester ce filtre sur une nouvelle période</button>') + '</div>';
    else verdict = '<div class="avis rougef"><b>Le filtre ne marche que dans une des deux moitiés.</b> C\'est la signature du hasard : tu as trouvé les bons trades après coup. N\'en fais pas une règle.</div>';
  }
  var jm = [1, 2, 3, 4, 5].map(function(j){ return [String(j), JOURS_FR[j]]; });
  function cellMoitie(b){ return '<td class="num">' + b.tous.nb + ' tr. · <b class="' + cls(b.tous.moyenne) + '">' + fmtR(b.tous.moyenne) + '</b></td><td class="num">' + b.gardes.nb + ' tr. · <b class="' + cls(b.gardes.moyenne) + '">' + fmtR(b.gardes.moyenne) + '</b></td>'; }

  el.innerHTML =
    '<div class="carte"><div class="ligne ecart"><h3 class="mb0">Et si je ne prenais que...</h3><button class="pt" id="laRaz">Tout effacer</button></div>' +
      '<div class="grille g2 mt12">' +
        '<div><h4>Séances</h4>' + chipsLabo('seances', ordreSeances().map(function(s){ return [s, s]; }), f.seances) + '</div>' +
        '<div><h4>Jours</h4>' + chipsLabo('jours', jm, f.jours.map(String)) + '</div>' +
        '<div><h4>Étapes obligatoirement présentes</h4>' + (cf.length ? chipsLabo('confl', cf.map(function(c){ return [c.id, c.nom]; }), f.confl) : '<span class="petit gris">aucune</span>') + '</div>' +
        '<div><h4>Étiquettes (au moins une)</h4>' + chipsLabo('tags', E.reglages.etiquettes.map(function(x){ return [x, x]; }), f.tags) + '</div>' +
      '</div>' +
      '<div class="ligne mt12">' +
        '<label class="champ mb0" style="width:auto"><span>Sens</span><select id="laSens" style="width:auto"><option value="">Les deux</option><option value="long">Long</option><option value="short">Short</option></select></label>' +
        '<label class="champ mb0" style="width:auto"><span>Qualité minimum</span><select id="laQual" style="width:auto"><option value="">Toutes</option>' + QUALITES.map(function(q){ return '<option>' + q + '</option>'; }).join('') + '</select></label>' +
        '<label class="champ mb0" style="width:auto"><span>Biais</span><select id="laBiais" style="width:auto"><option value="">Peu importe</option><option value="avec">Dans le sens du biais</option><option value="pascontre">Jamais contre le biais</option></select></label>' +
        '<label class="champ mb0" style="width:auto"><span>Entrée après</span><input type="time" id="laDe" value="' + ech(f.heureDe) + '"></label>' +
        '<label class="champ mb0" style="width:auto"><span>et avant</span><input type="time" id="laA" value="' + ech(f.heureA) + '"></label>' +
        '<label class="pilule-interrupteur"><input type="checkbox" id="laPlan"' + (f.seulementPlan ? ' checked' : '') + '> dans le plan</label>' +
        '<label class="pilule-interrupteur"><input type="checkbox" id="laDout"' + (f.exclureDouteux ? ' checked' : '') + '> sans les douteux</label>' +
      '</div>' +
      (desc.length ? '<div class="avis bleuf mt12 petit"><b>Ton filtre :</b> ' + ech(desc.join(' · ')) + '</div>' : '') +
    '</div>' +
    verdict +
    '<div class="tableau-boite" style="margin-bottom:14px"><table><thead><tr><th></th><th class="num">Trades</th><th class="num">Par semaine</th><th class="num">Réussite</th>' +
      '<th class="num">Espérance</th><th class="num">Total</th><th class="num">Fact. profit</th><th class="num">Pire recul</th><th class="num">Fourchette 95 %</th></tr></thead><tbody>' +
      ligneComparaison('Tous les trades', tr, jours, 'total') +
      ligneComparaison('Gardés par le filtre', gardes, jours) +

/* =======================================================================
   ECRAN 7 : CIBLE ET STOP (MFE / MAE)

var CIBLES = [1, 1.5, 2, 2.5, 3, 4, 5, 6];
var BES = [null, 1, 1.5, 2];
function couleurChaleur(v, maxAbs){
  if (v === null || v === undefined) return 'transparent';
  var a = Math.min(0.65, 0.08 + 0.57 * Math.abs(v) / Math.max(maxAbs, 0.05));
  return v >= 0 ? 'rgba(38,166,154,' + a.toFixed(2) + ')' : 'rgba(239,83,80,' + a.toFixed(2) + ')';
}
function rendreSorties(){
  var el = $('#ec-sorties');

  if (!tr.length) { el.innerHTML = videAnalyse(); return; }
  var g = grilleSorties(tr, CIBLES, BES);
  var explication =
    '<div class="avis bleuf petit">Pour chaque trade tu notes le <b>MFE</b> : jusqu\'où le prix est allé dans ton sens, en R, avant de toucher ton stop (ou avant la fin de la séance). ' +
    'Avec ça, l\'app rejoue tes trades avec d\'autres cibles, une mise au point mort (BE) ou un partiel, et te dit ce qui aurait rapporté le plus. ' +
    '<b>Hypothèse prudente :</b> une cible non atteinte finit au stop, ou au BE si la règle BE s\'est déclenchée. <b>Après un TP, laisse avancer le replay</b> pour noter le vrai MFE, sinon les grandes cibles sont sous-estimées.</div>';
  if (g.nb < 10) {
    el.innerHTML = explication + '<div class="vide">Il faut au moins 10 trades avec le MFE noté (tu en as ' + g.nb + ' sur ' + tr.length + ').<br>' +
      'Ouvre un trade et remplis « Max en ta faveur (MFE) », ou importe la liste des trades du testeur de stratégie TradingView : sa colonne Run-up devient le MFE.</div>';
    return;
  }
  var maxAbs = 0;
  g.lignes.forEach(function(l){ l.cellules.forEach(function(c){ if (c.stats && c.stats.moyenne !== null) maxAbs = Math.max(maxAbs, Math.abs(c.stats.moyenne)); }); });
  var rrs = {};
  (E.filtre.campagne ? [campagneDe(E.filtre.campagne)] : E.campagnes).forEach(function(c){ var st = strategieDeCampagne(c); if (st && st.rrDefaut) rrs[st.rrDefaut] = true; });
  var rrActuel = Object.keys(rrs).length === 1 ? +Object.keys(rrs)[0] : null;
  var att = atteintes(tr, [0.5, 1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]);
  var best = g.meilleur;
  var avecMae = tr.filter(function(t){ return estNombre(t.mfe) && estNombre(t.mae); }).length;
  var cibleStop = best ? best.cible : (rrActuel || 2);
  var bs = avecMae >= 10 ? balayageStop(tr, cibleStop, [0.5, 0.6, 0.7, 0.8, 0.9, 1]) : null;
  var partiels = [{ a: 1, part: 0.5 }, { a: 2, part: 0.5 }].map(function(p){
    return { p: p, cellules: CIBLES.map(function(c){ return c <= p.a + EPS ? null : statsRegle(tr.filter(function(t){ return estNombre(t.mfe); }), { cible: c, be: null, stopFrac: 1, partiel: p }); }) };
  });

  el.innerHTML = explication +
    (g.nbSansMfe ? '<div class="avis jaunef petit">' + pluriel(g.nbSansMfe, 'trade') + ' sans MFE ' + (g.nbSansMfe > 1 ? 'ne sont pas' : 'n\'est pas') + ' dans les calculs de cet écran (' + pluriel(g.nb, 'trade utilisé', 'trades utilisés') + ').</div>' : '') +
    '<div class="deux-col">' +
      '<div class="carte"><h3>Jusqu\'où vont tes trades</h3><p class="petit gris">Part des trades où le prix a atteint au moins ce niveau en ta faveur, avant le stop.</p>' +
        barresPct(att.map(function(a){ return { etq: fmtR(a.niveau, 1), part: a.part, extra: a.nb + ' tr.', couleur: a.niveau >= 3 ? 'var(--vert)' : 'var(--accent)' }; })) +
      '</div>' +
      '<div class="carte"><h3>Le meilleur réglage trouvé</h3>' +
        (best ? '<div class="grand-pct ' + cls(best.stats.moyenne) + '">' + fmtR(best.stats.moyenne) + '</div><div class="petit gris">par trade en moyenne</div>' +
          '<p class="verdict mt12">Cible à <b>' + fmtR(best.cible, 1) + '</b>' + (best.be !== null ? ', stop au point mort dès <b>' + fmtR(best.be, 1) + '</b>' : ', sans BE') + ' : ' +
          'réussite ' + fmtPct(best.stats.tauxReussite) + ', total ' + fmtR(best.stats.total, 1) + ' sur ' + best.stats.nb + ' trades.</p>' +
          '<p class="petit gris">Ta façon réelle sur les mêmes trades : <b class="' + cls(g.reel.moyenne) + '">' + fmtR(g.reel.moyenne) + '</b> par trade, total ' + fmtR(g.reel.total, 1) + '.</p>' +
          '<div class="avis jaunef petit">Le meilleur réglage d\'un échantillon est toujours un peu flatteur : c\'est celui qui colle le mieux à CES trades. Ne change ta cible que si l\'écart est net (0,1 R ou plus) et confirme-le sur la campagne suivante.</div>'
          : '<div class="petit gris">--</div>') +
      '</div>' +
    '</div>' +
    '<div class="carte"><h3>Espérance par trade selon la cible et la mise au BE</h3>' +
      '<p class="petit gris">Chaque case rejoue tes ' + g.nb + ' trades avec ce réglage. Survole une case pour le détail. Encadré blanc = le meilleur' + (rrActuel ? ' ; encadré jaune = ta cible actuelle (' + fmtR(rrActuel, 1) + ', sans BE)' : '') + '.</p>' +
      '<div class="tableau-boite"><table class="chaleur auto"><thead><tr><th>Mise au BE</th>' + CIBLES.map(function(c){ return '<th class="num">Cible ' + fmtNombre(c, c % 1 ? 1 : 0) + ' R</th>'; }).join('') + '</tr></thead><tbody>' +
      g.lignes.map(function(l){
        return '<tr><td class="gras">' + (l.be === null ? 'Jamais' : 'dès ' + fmtR(l.be, 1)) + '</td>' + l.cellules.map(function(c){
          if (!c.stats) return '<td class="cell gris3">·</td>';
          var s = c.stats, estMeilleur = best && best.cible === c.cible && best.be === l.be, estActuel = rrActuel && Math.abs(rrActuel - c.cible) < EPS && l.be === null;
          var bulle = 'Cible ' + fmtR(c.cible, 1) + (l.be === null ? ', jamais au BE' : ', BE dès ' + fmtR(l.be, 1)) + '<br>Réussite ' + fmtPct(s.tauxReussite) + ' · total ' + fmtR(s.total, 1) + ' · facteur ' + (s.facteurProfit === null ? '--' : fmtFacteur(s.facteurProfit)) + '<br>Pire recul -' + fmtNombre(s.ddMax, 1) + ' R';
          return '<td class="cell' + (estMeilleur ? ' meilleur' : '') + (estActuel ? ' actuel' : '') + '" style="background:' + couleurChaleur(s.moyenne, maxAbs) + '" data-bulle="' + ech(bulle) + '">' + fmtR(s.moyenne) + '</td>';
        }).join('') + '</tr>';
      }).join('') +
      partiels.map(function(pl){
        return '<tr><td class="gras">Partiel 50 % à ' + fmtR(pl.p.a, 0) + ', reste au BE</td>' + pl.cellules.map(function(s, i){
          if (!s) return '<td class="cell gris3">·</td>';
          var bulle = '50 % pris à ' + fmtR(pl.p.a, 0) + ', l\'autre moitié vise ' + fmtR(CIBLES[i], 1) + ' avec le stop au point mort<br>Réussite ' + fmtPct(s.tauxReussite) + ' · total ' + fmtR(s.total, 1);
          return '<td class="cell" style="background:' + couleurChaleur(s.moyenne, maxAbs) + '" data-bulle="' + ech(bulle) + '">' + fmtR(s.moyenne) + '</td>';
        }).join('') + '</tr>';
      }).join('') +
      '</tbody></table></div></div>' +
    '<div class="carte"><h3>Et avec un stop plus serré ?</h3>' +
      (bs ? '<p class="petit gris">Il faut le <b>MAE</b> (jusqu\'où le prix est allé contre toi, 1 = ton stop). Un stop à 70 % de la distance d\'origine sort tous les trades qui sont allés à 0,7 R contre toi ; en échange, chaque R gagné vaut plus. Cible gardée : ' + fmtR(cibleStop, 1) + ' du nouveau stop.</p>' +
        '<div class="tableau-boite"><table class="auto"><thead><tr><th>Stop</th><th class="num">Trades</th><th class="num">Réussite</th><th class="num">Espérance</th><th class="num">Total</th><th class="num">Pire recul</th></tr></thead><tbody>' +
        bs.map(function(x){
          var s = x.stats;
          return '<tr' + (Math.abs(x.frac - 1) < EPS ? ' class="total"' : '') + '><td>' + (Math.abs(x.frac - 1) < EPS ? 'Ton stop actuel' : Math.round(x.frac * 100) + ' % de la distance') + '</td><td class="num">' + s.nb + '</td><td class="num">' + fmtPct(s.tauxReussite) + '</td>' +
            '<td class="num gras ' + cls(s.moyenne) + '">' + fmtR(s.moyenne) + '</td><td class="num ' + cls(s.total) + '">' + fmtR(s.total, 1) + '</td><td class="num rouge">-' + fmtNombre(s.ddMax, 1) + ' R</td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="aide">Un stop plus serré change aussi la taille de position : à risque égal en dollars, tu prends plus de contrats. Les frais pèsent alors plus lourd.</div>'

  var mur = $('#gaMur');

  var morceaux = [];
  for (var i = 0; i < ordre.length; i++) {

    }

}

async function lireJournalReel(){
  if (!indexedDB.databases) return { erreur: 'Ce navigateur ne permet pas de vérifier si le journal existe. Utilise le fichier de sauvegarde du journal.' };
  var dbs = [];
  try { dbs = await indexedDB.databases(); } catch (e) {}
  // on n'ouvre JAMAIS une base qui n'existe pas : ce serait en creer une vide
  if (!dbs.some(function(d){ return d.name === 'journal-trading'; })) {
    return { erreur: 'Ton journal de trading n\'est pas à la même adresse que cette app' + (location.protocol === 'file:' ? ' (ici, un fichier ouvert sur l\'ordinateur)' : '') +
      ', donc ce navigateur ne le voit pas. Choisis plutôt une sauvegarde du journal (bouton Exporter du journal).' };
  }
  return new Promise(function(res){
    var r;
    try { r = indexedDB.open('journal-trading'); } catch (e) { res({ erreur: 'Ouverture impossible.' }); return; }
    r.onupgradeneeded = function(e){ try { e.target.transaction.abort(); } catch (x) {} };
    r.onblocked = function(){ res({ erreur: 'Le journal est en cours de mise à jour dans un autre onglet. Réessaie dans un instant.' }); };
    r.onerror = function(){ res({ erreur: 'Lecture du journal impossible.' }); };
    r.onsuccess = function(){
      var db = r.result;
      if (!db.objectStoreNames.contains('trades')) { db.close(); res({ erreur: 'Le journal ne contient encore aucun trade.' }); return; }
      var q = db.transaction('trades', 'readonly').objectStore('trades').getAll();
      q.onsuccess = function(){ var t = q.result; db.close(); res({ trades: t }); };
      q.onerror = function(){ db.close(); res({ erreur: 'Lecture des trades impossible.' }); };
    };
  });
}
function retenirReel(brut, source){
  var reels = brut.filter(function(t){ return !t.simule; });
  var conv = reels.map(depuisJournal).filter(Boolean);
  E.reel = { source: source, lu: Date.now(), nbBruts: reels.length, nbBacktestJournal: brut.length - reels.length,
             trades: conv.filter(function(t){ return t.r !== null; }), nbSansR: conv.filter(function(t){ return t.r === null; }).length,
             backtestJournal: brut.filter(function(t){ return t.simule; }) };
}

function chargerSheetJS(){
  if (window.XLSX) return Promise.resolve();
  return new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = function(){ res(); };
    s.onerror = function(){ rej(new Error('impossible de charger le lecteur Excel (il faut Internet). Enregistre le fichier en CSV.')); };
    document.head.appendChild(s);
  });
}
// La vraie ligne d'entete : la premiere qui a au moins 3 cases remplies.
function nettoyerLignes(lignes){
  var i = 0;
  while (i < lignes.length && lignes[i].filter(function(x){ return String(x).trim() !== ''; }).length < 3) i++;
  return lignes.slice(i).map(function(l){ return l.map(function(x){ return typeof x === 'number' ? x : String(x == null ? '' : x).trim(); }); });
}
async function lireFichierImport(f){
  var lignes;
  if (/\.xlsx?$/i.test(f.name)) {
    await chargerSheetJS();
    var wb = window.XLSX.read(await f.arrayBuffer(), { type: 'array' });
    lignes = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
  } else lignes = parserCSV(await f.text());
  return nettoyerLignes(lignes);
}
async function recevoirFichierImport(f){
  try {
    var lignes = await lireFichierImport(f);
    if (lignes.length < 2) { toast('Le fichier ne contient pas de lignes de trades.', 'rougef'); return; }
    var tv = estListeTradesTV(lignes[0]);
    var camp = E.filtre.campagne || E.reglages.campagneActive || (E.campagnes[0] && E.campagnes[0].id) || '';
    var strat = strategieDeCampagne(campagneDe(camp));
    IMPORT = { nom: f.name, lignes: lignes, type: tv ? 'tv' : 'gen', map: devinerColonnes(lignes[0]), campagneId: camp, unR: null,
               rrDefaut: strat && strat.rrDefaut ? strat.rrDefaut : 3 };
    if (tv) {
      var essai = lireListeTradesTV(lignes, 0);
      IMPORT.unR = proposerUnR(essai.pertes) || E.reglages.dernierUnR || null;
    }
    rendre();
  } catch (e) { toast('Lecture impossible : ' + ech(e.message || e), 'rougef'); }
}

function blobVersDataUrl(b){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){ res(fr.result); };
    fr.onerror = function(){ rej(fr.error); };
    fr.readAsDataURL(b);
  });
}
function dataUrlVersBlob(u){
  var i = u.indexOf(',');
  var type = (u.slice(0, i).match(/data:([^;]+)/) || [])[1] || 'application/octet-stream';
  var bin = atob(u.slice(i + 1));
  var arr = new Uint8Array(bin.length);
  for (var k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  return new Blob([arr], { type: type });
}
function telecharger(nom, contenu, type){
  var b = contenu instanceof Blob ? contenu : new Blob([contenu], { type: type || 'application/octet-stream' });
  var lien = URL.createObjectURL(b);
  var a = document.createElement('a');
  a.href = lien; a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  // garder l'URL en vie : revoquer trop tot annule un gros telechargement en cours
  setTimeout(function(){ URL.revokeObjectURL(lien); }, 600000);
  return b.size;
}
function horodatageFichier(){
  var d = new Date();
  return aujourdhui() + '-' + deuxChiffres(d.getHours()) + 'h' + deuxChiffres(d.getMinutes());
}

                   reglages: E.reglages, campagnes: E.campagnes, strategies: E.strategies, trades: E.trades, jours: E.jours, images: images };
    var txt = JSON.stringify(paquet);
    var nom = 'journal-backtest-' + horodatageFichier() + (avecImages ? '' : '-sans-captures') + '.json';
    telecharger(nom, txt, 'application/json');

  } catch (e) { toast('Export impossible : ' + ech(e.message || e), 'rougef'); }

/* =======================================================================
   PARTAGE : un lien qui transporte les resultats d'une campagne
   Aucun serveur : les donnees sont compressees dans la partie apres le #,
   que le navigateur n'envoie jamais. Le lien est une photo figee.
   ======================================================================= */
var ADRESSE_EN_LIGNE = 'https://vaelordesign.github.io/journal-backtest/';
function base64urlDepuisOctets(oct){
  var s = '';
  for (var i = 0; i < oct.length; i += 8192) s += String.fromCharCode.apply(null, oct.subarray(i, i + 8192));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function octetsDepuisBase64url(s){
  var b = s.replace(/-/g, '+').replace(/_/g, '/');
  while (b.length % 4) b += '=';
  var bin = atob(b), oct = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) oct[i] = bin.charCodeAt(i);
  return oct;
}
async function encoderPartage(obj){
  var octets = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream === 'undefined') return 'b' + base64urlDepuisOctets(octets);
  var flux = new Blob([octets]).stream().pipeThrough(new CompressionStream('gzip'));
  return 'g' + base64urlDepuisOctets(new Uint8Array(await new Response(flux).arrayBuffer()));
}
async function decoderPartage(s){
  var mode = s.charAt(0), oct = octetsDepuisBase64url(s.slice(1));
  if (mode === 'b') return JSON.parse(new TextDecoder().decode(oct));
  var flux = new Blob([oct]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(flux).text());
}
function construirePartage(campId, avecNotes){
  var c = campagneDe(campId), s = strategieDeCampagne(c);
  var cf = (s && s.confluences) || [];
  var trades = trierChrono(tradesDeCampagne(campId));
  var avecTrade = {};
  trades.forEach(function(t){ avecTrade[t.date] = true; });
  return {
    v: 1, n: c.nom, s: s ? s.nom : '', sy: c.symbole || '', d: c.debut, f: c.fin, h: c.hypothese || '', g: aujourdhui(), se: E.reglages.seances,
    cf: cf.map(function(x){ return [x.nom, x.obligatoire ? 1 : 0]; }),
    jv: E.jours.filter(function(j){ return j.campagneId === campId && j.teste && !avecTrade[j.date]; }).map(function(j){ return j.date; }),
    t: trades.map(function(t){
      var bits = 0;
      cf.forEach(function(x, i){ if ((t.confl || {})[x.id]) bits |= (1 << i); });
      var l = [t.date, t.heure || '', t.sens === 'short' ? 0 : 1, rDuTrade(t), estNombre(t.mfe) ? t.mfe : null, QUALITES.indexOf(t.qualite), bits, t.douteux ? 1 : 0,
               t.biais ? t.biais.charAt(0) : '', estNombre(t.rrCible) ? t.rrCible : null];
      if (avecNotes) l.push(t.notes || '');
      return l;
    })
  };
}
